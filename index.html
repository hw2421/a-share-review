/* ================= 连板梯队（当日 2 板及以上，题材穿透） =================
   v46 恢复：数据仍取 R.lb[日期]（build_merged 生成、刷新 applyDayPool 同源）。 */
let LADDER_DATE = null;
function renderLadder(date){
  const R = window.REVIEW, LB = R.lb||{};
  const all = (R.dates||[]).slice().sort();
  // v71：日期选择还原（与今日复盘一致的 上/下拉/下/今日 形式），可定位任意交易日
  const sel = document.getElementById('ld-date');
  if(sel){
    if(sel.options.length !== all.length)
      sel.innerHTML = all.slice().reverse().map(d=>'<option value="'+d+'">'+fmtDate(d)+'</option>').join('');
    sel.value = date;
    sel.onchange = ()=>renderLadder(sel.value);
  }
  // v70：日期选择控件已删除，固定展示最新交易日（date 参数仅供内部调用/校验）
  if(!date || !all.includes(date)) date = LADDER_DATE && all.includes(LADDER_DATE) ? LADDER_DATE : all[all.length-1];
  LADDER_DATE = date;
  const list = document.getElementById('ladder-list');
  if(!date){
    list.innerHTML = '<div style="color:'+C.dim+'">暂无连板数据</div>';
    return;
  }
  const rows = LB[date]||[];
  const st = (R.stages||[]).find(x=>x.date===date) || {};
  const sf = (st.spaceFull||[]).map(s=>s.name+'·'+s.boards+'板').join('、');
  let html = '<div class="lbday"><b>'+fmtDate(date)+'</b>'+
    '<span class="st">涨停 '+(st.ztCount||0)+' 家 · 连板 '+rows.length+' 只'+
    (st.ztCount? '（首板 '+(st.ztCount-rows.length)+' 只）':'')+
    ' · 空间高度 '+(st.spaceTop||0)+' 板'+
    (sf? '（'+sf+'）':'')+'</span>'+
    stageChipHtml(st.stage)+'</div>';
  if(!rows.length){
    html += '<div style="color:'+C.dim2+';font-size:12px;padding:6px 0">当日无 2 板及以上连板股</div>';
  }
  const by = {};
  rows.forEach(r=>{ (by[r[1]] = by[r[1]]||[]).push(r); });
  Object.keys(by).map(Number).sort((a,b)=>b-a).forEach(lv=>{
    // 同身位个股按「当日题材强度」排列：板块涨停家数 > 板块最高板 > 首封时间早 > 代码
    const strength = th=>{
      const n = th ? tName(th) : '';
      const e = ((R.ladders||{})[date]||{})[n] || {};
      return (e.count||0)*100 + (e.maxB||0)*10;
    };
    const arr = by[lv].slice().sort((x,y)=>
      (strength(y[2]) - strength(x[2])) ||
      String(x[4]||'99:99').localeCompare(String(y[4]||'99:99')) ||
      String(x[3]||'').localeCompare(String(y[3]||'')));
    const tone = lv>=4 ? C.gold : (lv===3 ? C.up : C.text);
    html += '<div class="lblevel"><div class="lv" style="color:'+tone+'">'+lv+'板'+
      '<small>'+arr.length+'只</small></div><div class="items">'+
      arr.map(r=>{
        const nm = r[0], th = r[2]||'', code = r[3]||'', tm = r[4]||'';
        const col = th ? (T_COLOR[tName(th)]||C.blue) : C.dim2;
        return '<span class="lbstk'+(th?'':' noth')+'" data-c="'+code+'" data-n="'+nm+
          '" data-d="'+date+'" title="'+nm+' · 涨停时间 '+(tm||'—')+
          ' ｜ 点击看日K（箭头指 '+fmtDate(date)+'）">'+
          '<span class="nm">'+nm+'</span>'+
          (tm? '<span class="stime'+(tm>='14:00'?' late':'')+'" title="首次封板 '+tm+'">'+tm+'</span>':'')+
          '<span class="th" data-th="'+th+'" data-d="'+date+'" title="'+
          (th? '点击 → 题材炒作页「'+th+'」'+fmtDate(date)+'（闪动提示）' : '当日无题材归属')+
          '" style="color:'+(th? col : C.dim2)+';'+(th?'border-color:'+col+'55':'')+'">'+
          (th||'—')+'</span></span>';
      }).join('')+'</div></div>';
  });
  // 当日题材分布（含首板，点标签 → 题材炒作页闪动定位）
  const lad = (R.ladders||{})[date] || {};
  const tnames = Object.keys(lad).filter(nm=>lad[nm].count>=2 || lad[nm].maxB>=2)
    .sort((a,b)=>
    (lad[b].count-lad[a].count) || (lad[b].maxB-lad[a].maxB));
  if(tnames.length){
    html += '<div class="lblevel lbdist">'+
      '<div class="lv">题材<br>分布</div>'+
      '<div class="items">'+
      tnames.map(nm=>{
        const col = T_COLOR[tName(nm)]||C.blue;
        const lab = lad[nm].maxB>=2 ? lad[nm].ladder+' · '+lad[nm].count+'只'
                                    : '首板×'+lad[nm].count;
        return '<span class="lbstk" data-th="'+nm+'" data-d="'+date+'" '+
          'title="'+nm+'：当日涨停 '+lad[nm].count+' 只，梯队 '+lad[nm].ladder+
          ' ｜ 点击 → 题材炒作页闪动定位" style="border-color:'+col+'66">'+
          '<span class="nm" style="color:'+col+'">'+nm+'</span>'+
          '<span class="th" style="color:'+col+';border-color:'+col+'66">'+lab+'</span></span>';
      }).join('')+'</div></div>';
  }
  // v68：断板跟踪已移入「题材炒作」页对应题材的当日梯队（见 openLadPop）
  list.innerHTML = html;
  list.scrollTop = 0;
  list.querySelectorAll('.lbstk').forEach(el=>{
    el.onclick = ev=>{
      if(el.dataset.th){                       // 题材分布标签（v49：就地弹当日梯队，不跳转）
        ev.stopPropagation();
        openLadPop(el.dataset.th, el.dataset.d, ev);
        return;
      }
      const tg = ev.target.closest ? ev.target.closest('.th') : null;
      if(tg && tg.dataset.th){                 // 个股上的题材标签（v49：就地弹当日梯队）
        ev.stopPropagation();
        openLadPop(tg.dataset.th, tg.dataset.d, ev);
        return;
      }
      if(el.dataset.c) showK(el.dataset.c, el.dataset.n, ev, el.dataset.d);
    };
  });
}

/* ================= 交易复盘：单一战法「山顶洞人」回测（v42） =================
   全期逐笔由 strategies.py 预计算（R.review[method]），前端按手动输入的起止日期筛选、
   统计，并支持「参与模拟」：同日只取第一个符合条件个股 + 固定仓位 + 累积盈利。 */
let RV_FROM = '', RV_TO = '', RV_ROWS = [], RV_NOTE_OPEN = false;
function rvDateStr(d){ return d ? d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8) : ''; }
/* 年 / 月 / 日 三个条件选择：日下拉只列该月真实交易日，选完自动同步 date input */
function buildRvYmd(input, hostId){
  const host = document.getElementById(hostId);
  if(!host || !input) return;
  const ds = (window.REVIEW.dates||[]).slice().sort();
  const years = [...new Set(ds.map(x=>x.slice(0,4)))].sort();
  host.innerHTML = '<select class="rv-y" title="年">'+years.map(v=>'<option value="'+v+'">'+v+'年</option>').join('')+'</select>'+
    '<select class="rv-m" title="月"></select><select class="rv-d" title="日"></select>';
  const y=host.querySelector('.rv-y'), m=host.querySelector('.rv-m'), d=host.querySelector('.rv-d');
  const sync = ()=>{
    // v17 修复：日下拉 value 本身就是完整 8 位交易日（如 20240102），
    // 不能再用 y.value+m.value+d.value 拼接（会变 14 位，导致 input 从不回写、
    // 「日期三段选完点确定」无效）。直接取 d.value，缺失时退回当月首个交易日。
    let v = d.value || '';
    if(v.length!==8) v = ds.find(x=>x.startsWith(y.value+m.value)) || '';
    if(v.length===8) input.value=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8);
  };
  const fillD = keep=>{
    const list=ds.filter(x=>x.startsWith(y.value+m.value));
    d.innerHTML=list.map(v=>'<option value="'+v+'">'+(+v.slice(6))+'日</option>').join('');
    if(keep && list.includes(keep)) d.value=keep;
    sync();
  };
  const fillM = keep=>{
    const ms=[...new Set(ds.filter(x=>x.startsWith(y.value)).map(x=>x.slice(4,6)))].sort();
    m.innerHTML=ms.map(v=>'<option value="'+v+'">'+(+v)+'月</option>').join('');
    if(keep && ms.includes(keep)) m.value=keep;
    fillD();
  };
  const fromInput = ()=>{
    const v=(input.value||'').replace(/-/g,'');
    if(v.length!==8 || !ds.includes(v)) return;
    y.value=v.slice(0,4); fillM(v.slice(4,6)); fillD(v);
  };
  y.onchange=()=>fillM(); m.onchange=()=>fillD(); d.onchange=sync;
  input.addEventListener('change', fromInput);
  host.__fromInput = fromInput;
  host.__sync = sync;          // v17：「确定区间」时以三段下拉所选为准写回 input
  fromInput();
  if(!y.value){ y.value=years[years.length-1]; fillM(); }
}
function applyRvNote(){
  const box=document.getElementById('rv-note'), tg=document.getElementById('rv-note-tg');
  if(box) box.style.display = RV_NOTE_OPEN ? 'block' : 'none';
  if(tg) tg.textContent = RV_NOTE_OPEN ? '战法口径说明 · 点击收起 ▴' :
                                       '战法口径说明 · 点击展开 ▾';
}
function rvMeta(m){
  const meta = (window.REVIEW.reviewMeta||{})[m];
  return meta || {name:'战法 '+(RV_MSHORT[m]||m),
    buy:'按该战法定义的买入条件，盘中冲击涨停、按涨停价打板。',
    sell:'次日仍涨停持仓，首个收盘未涨停日尾盘卖出，盘中 -7% 止损。', note:''};
}
function rvAll(m){
  const r = window.REVIEW.review;
  if(!r) return [];
  return Array.isArray(r) ? (m==='summit' ? r : []) : (r[m]||[]);
}
function rvInit(){
  const ds = window.REVIEW.dates || [];
  const first = ds[0] || '', last = ds[ds.length-1] || '';
  const fi = document.getElementById('rv-from'), ti = document.getElementById('rv-to');
  if(!fi || !ti) return;
  fi.min = ti.min = rvDateStr(first); fi.max = ti.max = rvDateStr(last);
  const cut = ds[Math.max(0, ds.length-250)] || first;   // 默认最近约一年
  fi.value = rvDateStr(cut); ti.value = rvDateStr(last);
  RV_FROM = cut; RV_TO = last;
  buildRvYmd(fi, 'rv-f-ymd'); buildRvYmd(ti, 'rv-t-ymd');
  const syncYmd = ()=>{
    const fy=document.getElementById('rv-f-ymd'), ty=document.getElementById('rv-t-ymd');
    if(fy && fy.__fromInput) fy.__fromInput();
    if(ty && ty.__fromInput) ty.__fromInput();
  };
  // v17：日期三段（年/月/日）输入后点「确定区间」或「开始回测」→ 应用统计区间。
  // 三段下拉的 onChange 已通过 sync() 实时回写 input.value（见 buildRvYmd），
  // 也兼容直接手填 #rv-from/#rv-to，故此处只读 input，不再反向覆盖。
  const applyRvRange = ()=>{
    RV_FROM = (fi.value||'').replace(/-/g,'') || first;
    RV_TO = (ti.value||'').replace(/-/g,'') || last;
    if(RV_FROM > RV_TO){ const x=RV_FROM; RV_FROM=RV_TO; RV_TO=x;
      fi.value=rvDateStr(RV_FROM); ti.value=rvDateStr(RV_TO); }
    syncYmd(); renderReview();
  };
  const go=document.getElementById('rv-go'); if(go) go.onclick=applyRvRange;
  const ok=document.getElementById('rv-ok'); if(ok) ok.onclick=applyRvRange;
  document.getElementById('rv-all').onclick = ()=>{
    fi.value = rvDateStr(first); ti.value = rvDateStr(last);
    RV_FROM = first; RV_TO = last; syncYmd(); renderReview();
  };
  document.getElementById('rv-method').onchange = renderReview;
  const sim = document.getElementById('rv-sim'), pos = document.getElementById('rv-pos');
  if(sim) sim.onchange = renderReview;
  if(pos) pos.onchange = renderReview;
  const ntg=document.getElementById('rv-note-tg');
  if(ntg) ntg.onclick=()=>{ RV_NOTE_OPEN=!RV_NOTE_OPEN; applyRvNote(); };
  rrInit();
  renderReview();
}
// v17：解析「该股当日所属题材 + 该题材当日完整梯队」。
// 优先用 code 反查（最准确，避免历史归属题材串到不相关题材）；其余用题材名归一化兜底。
function themeLadderOf(d, th, code){
  const R=window.REVIEW, LF=(R.ladderFull||{})[d]||{}, TD=(R.themeDetail||{})[d]||[];
  const norm=x=>String(x).replace(/(概念|板块|题材)$/g,'');
  let nm='', arr=[], byCode=false;
  for(const k of Object.keys(LF)){
    if((LF[k]||[]).some(s=>s.code===code)){ nm=k; arr=LF[k]; byCode=true; break; }
  }
  if(!arr.length){
    for(const b of TD){
      if((b.stocks||[]).some(s=>s.code===code)){ nm=b.name; arr=LF[b.name]||b.stocks||[]; byCode=true; break; }
    }
  }
  if(!arr.length && th && th!=='—'){
    let k=th;
    if(!LF[k]){ const kk=Object.keys(LF).find(x=>x===th || norm(x)===norm(th)); if(kk) k=kk; }
    if(LF[k] && LF[k].length){ nm=k; arr=LF[k]; }
    else { const b=TD.find(x=>tName(x.name)===tName(th)); if(b){ nm=b.name; arr=LF[b.name]||b.stocks||[]; } }
  }
  return {nm:nm||th||'', arr:arr||[], byCode:byCode};
}
function renderReview(){
  const mEl = document.getElementById('rv-method');
  const m = (mEl && mEl.value) || 'summit';
  const meta = rvMeta(m), all = rvAll(m);
  const a = RV_FROM || '00000000', b = RV_TO || '99999999';
  const simEl = document.getElementById('rv-sim');
  const sim = !!(simEl && simEl.checked);
  const posEl = document.getElementById('rv-pos');
  const pos = Math.max(1, Math.min(100, +(posEl && posEl.value) || 100));
  let rows = all.filter(t=>t.d >= a && t.d <= b);
  const nAll = rows.length;
  // 参与模拟：① 同一天多个符合条件个股只取第一个；② 同一只股票在持仓周期内不加仓
  //   （交易口径：同股上一笔未结束则不再参与；非战法定义）
  if(sim){
    const seenDay = new Set();
    const held = {};                 // code -> 该股最后一笔参与的买入日索引
    const dayIdx = {};               // 日期 -> 序号
    let di = 0;
    rows.slice().sort((x,y)=>x.d.localeCompare(y.d)).forEach(t=>{
      if(dayIdx[t.d]===undefined) dayIdx[t.d]=di++;
    });
    rows = rows.filter(t=>{
      if(seenDay.has(t.d)) return false;
      seenDay.add(t.d);
      const h = held[t.code];
      if(h!==undefined && dayIdx[t.d] <= h) return false;   // 同股持仓周期内不加仓
      held[t.code] = dayIdx[t.d] + (t.hold||1);              // 持仓至卖出日
      return true;
    });
  }
  // 累积盈利比例 = 期末资金 / 初始资金（初始按 100% 起始）。
  // 每笔以「当前总资金的 pos%」参与，按日期升序逐笔复利累计：
  // 例：第一笔 100% 仓位盈利 5% → 100 × 1.05 = 105.00%
  const cum = {}; let capital = 100;
  rows.slice().sort((x,y)=>x.d.localeCompare(y.d)||x.code.localeCompare(y.code))
    .forEach(t=>{ capital *= (1 + (t.pnl/100) * (pos/100));
                   cum[t.d+'|'+t.code] = capital; });
  const finalCum = capital - 100;      // 汇总仍展示累计盈亏百分点
  const note = document.getElementById('rv-note');
  // v17：统一口径优先读后端 reviewMeta[m].uni —— 明确「所有买点都是涨停价打板、
  // 炸板也统计」与「除空间突破外，买点须距当日空间压制 ≥2 个涨停」两条新口径。
  const uniTxt = (meta.uni || (
    '符合买入条件即以涨停价买入（收盘炸板也按涨停价模拟）；'+
    '当日一字涨停实际买不进，不纳入统计；遇一字跌停无换手卖不出，顺延至首个可成交交易日。'
  )).replace(/^【统一口径】/, '');
  // 后端 buy 文案自带「【买入】」前缀，避免再拼一次「买入：【买入】」
  const buyTxt = /^【买入】/.test(meta.buy||'') ? meta.buy : '【买入】'+(meta.buy||'');
  if(note) note.innerHTML = '<b style="color:'+C.gold+'">'+meta.name+'</b><br>'+buyTxt+
    '<br><b>卖出</b>：'+meta.sell+
    (meta.note ? '<br><span style="opacity:.82">'+meta.note+'</span>' : '')+
    '<br><span style="color:#ffe08a">统一口径</span>：'+uniTxt+
    '<br>累积盈利比例：初始资金按 100%，每笔以仓位的 '+pos+'% 复利累计（首笔满仓 +5% → 105%）。'+
    '明细表「买入日炸板」指模拟买入当日是否炸板，而非卖出当日。';
  const scope = document.getElementById('rv-scope');
  if(scope) scope.textContent = '全期 '+all.length+' 笔 · 本次 '+nAll+' 笔'+
    (sim ? '（参与模拟：同日首笔 + 同股不加仓 → '+rows.length+' 笔）' : '')+
    '（'+rvDateStr(a)+' ~ '+rvDateStr(b)+'）';
  const n = rows.length;
  const wins = rows.filter(t=>t.pnl>0), loses = rows.filter(t=>t.pnl<0);
  const sumPnl = arr=>arr.reduce((s,t)=>s+t.pnl,0);
  const avgWin = wins.length ? sumPnl(wins)/wins.length : 0;      // 笔均盈利（盈利累加/盈利笔数）
  const avgLose = loses.length ? sumPnl(loses)/loses.length : 0;  // 笔均亏损（亏损累加/亏钱笔数，为负）
  const winRate = n ? wins.length/n*100 : 0;
  const plRatio = avgLose ? Math.abs(avgWin/avgLose) : 0;
  const col = v => v>=0 ? C.up : '#2ebd85';
  const kv = (k,v,c)=>'<div class="kv"><span class="k">'+k+'</span>'+
    '<span class="v" style="color:'+(c||C.text)+'">'+v+'</span></div>';
  const sum = document.getElementById('rv-sum');
  if(sum) sum.innerHTML =
    kv('交易笔数', n) +
    kv('成功率', winRate.toFixed(1)+'%', col(winRate-50)) +
    kv('笔均盈利', (avgWin>0?'+':'')+avgWin.toFixed(2)+'%', C.up) +
    kv('笔均亏损', avgLose.toFixed(2)+'%', '#2ebd85') +
    kv('盈亏比', plRatio ? plRatio.toFixed(2) : '—', plRatio ? col(plRatio-1) : C.dim2) +
    kv('最大单笔盈利', n ? '+'+Math.max.apply(null, rows.map(t=>t.pnl)).toFixed(2)+'%' : '—', C.up) +
    kv('最大单笔亏损', n ? Math.min.apply(null, rows.map(t=>t.pnl)).toFixed(2)+'%' : '—', '#2ebd85') +
    kv('模拟累积盈利', capital.toFixed(2)+'%（'+(finalCum>=0?'+':'')+finalCum.toFixed(2)+'%）', col(finalCum));
  const f2 = v => (v==null ? '—' : (+v).toFixed(2));
  // v43 列顺序：盈亏比例 → 市场情绪阶段 → 当日题材（阶段紧跟盈亏，其后对应题材）；
  // 买入日 / 个股 两列 sticky 固定，左右滚动不受影响。
  let html = '<table class="rv-tbl"><thead><tr>'+
    '<th class="l rv-fz rv-fz1">买入日</th><th class="l rv-fz rv-fz2">个股</th><th>连板</th>'+
    '<th>盈亏比例</th><th>市场情绪阶段</th><th class="l">当日题材</th>'+
    '<th>累积盈利比例</th><th class="l">买入逻辑</th><th class="l">卖出原因</th>'+
    '<th>买入日炸板</th><th>买入价</th><th>卖出日</th><th>持仓</th><th>卖出价</th>'+
    '</tr></thead><tbody>';
  RV_ROWS = rows;
  const STGC = {'节点':'#9fe3e0','补涨':'#ffd24a','突破':'#f5455c','主升':'#a55eea'};
  // 用户口径：明细按时间升序排列（最早一笔在最上），不复利倒序展示
  rows.forEach((t,i)=>{
    const cls = t.pnl>0 ? 'rv-up' : (t.pnl<0 ? 'rv-down' : '');
    const c = cum[t.d+'|'+t.code] || 100;
    const burst = (t.burst!=null ? t.burst : !t.sealed);
    html += '<tr>'+
      '<td class="l rv-fz rv-fz1">'+rvDateStr(t.d)+'</td>'+
      '<td class="l rv-fz rv-fz2"><span class="rv-stk" data-i="'+i+
        '" title="点击查看日K及模拟买卖点（B 买 / S 卖）'+
        (t.why? '&#10;买入理由：'+t.why : '')+'" style="cursor:pointer;color:'+C.blue+'">'+t.name+'</span>'+
        (String(t.why||'').includes('近100日最大量') ?
          '<span class="rv-vmax" title="买入当日成交量为近 100 个交易日最大量（放量最佳形态）">量</span>' : '')+
        (burst ? '<span class="rv-burst" title="买入当日炸板，仍按涨停价模拟买入">炸</span>' : '')+'</td>'+
      '<td>'+(t.boards!=null ? t.boards+'板' : '—')+'</td>'+
      '<td class="'+cls+'">'+(t.pnl>0?'+':'')+f2(t.pnl)+'%</td>'+
      '<td class="rv-stg" style="color:'+(STGC[t.stage]||'#78849a')+'">'+(t.stage||'—')+'</td>'+
      '<td class="rv-thm" data-th="'+(t.theme||'')+'" data-d="'+t.d+'" data-row="'+i+'"'+
        ' title="点击查看 '+rvDateStr(t.d)+' 该题材当日梯队">'+(t.theme||'—')+'</td>'+
      '<td class="rv-cum'+(c<100?' rv-down':'')+'">'+f2(c)+'%</td>'+
      '<td class="l rv-lg" title="'+(t.why||'')+'">'+(t.logic||'赚钱效应龙头')+'</td>'+
      '<td class="l rsn">'+t.reason+'</td>'+
      '<td>'+(burst ? '<span class="rv-brs">是</span>' : '<span class="rv-no">否</span>')+'</td>'+
      '<td>'+f2(t.buy)+'</td>'+
      '<td>'+rvDateStr(t.sellD)+'</td>'+
      '<td>'+t.hold+'日</td>'+
      '<td>'+f2(t.sell)+'</td></tr>';
  });
  if(!n) html += '<tr><td colspan="14" style="text-align:center;color:'+C.dim2+
    ';padding:16px">该时间段内无符合条件的交易，请调整起止日期或点「全部区间」</td></tr>';
  html += '</tbody></table>';
  document.getElementById('rv-table').innerHTML = html;
  rvFreezeCols();
  document.querySelectorAll('#rv-table .rv-stk').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation(); const t = RV_ROWS[+el.dataset.i];
      showK(t.code, t.name, ev, t.d, t); };
  });
  // 「当日题材」列点击 → 弹出该题材当日板块梯队（复用题材炒作页浮层）
  // 「当日题材」列点击 → 显示该笔交易当日所属题材的完整板块梯队
  document.querySelectorAll('#rv-table .rv-thm[data-th]').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation();
      const th=el.dataset.th, d=el.dataset.d, lp=document.getElementById('ladpop');
      if(!lp) return;
      lp.style.display='none';
      const t=RV_ROWS[+el.dataset.row]||{};
      const R=window.REVIEW, LF=(R.ladderFull||{})[d]||{};
      const res=themeLadderOf(d, th, t.code);
      // 只要该题材当日有收盘涨停梯队，就用题材炒作页同款浮层完整展示
      if(res.nm && LF[res.nm] && LF[res.nm].length){
        openLadPop(res.nm, d, ev);
        if(!(LF[res.nm]||[]).some(sx=>sx.code===t.code) && lp.querySelector('.lfoot')){
          lp.querySelector('.lfoot').innerHTML +=
            '<br><span style="color:#ffd23f">本笔「'+(t.name||'—')+'」盘中冲击 '+
            (t.boards||1)+' 板'+(t.burst?'后炸板回落':'')+
            '，按「必须涨停才统计」不计入上方收盘涨停梯队；上方为该题材当日真实梯队。</span>';
        }
        return;
      }
      if(!th || th==='—'){ toast('该笔交易无题材记录'); return; }
      // 该题材当日确无收盘涨停个股：弹说明浮层并列出该笔冲击板位，避免点击无反应

        'data-n="'+(t.name||'')+'" data-d="'+d+'"><b>'+(t.name||'—')+'</b>'+
        (t.burst?'<em class="st late">炸板</em>':'')+'</span></span></div>'+
        '<div class="lfoot">按全站「<b>必须涨停才统计</b>」口径，题材「'+th+'」在 '+
        rvDateStr(d)+' 无收盘涨停个股，真实梯队为空。该笔为<b>盘中冲击 '+bd+' 板'+
        (t.burst?'后炸板回落':'')+'</b>的模拟买入。点个股名看日K。</div>';
      lp.style.display='block';
      lp.style.left=Math.max(8,Math.min((ev&&ev.clientX||W/2)+14, W-lp.offsetWidth-8))+'px';
      lp.style.top =Math.max(8,Math.min((ev&&ev.clientY||H/2)-40, H-lp.offsetHeight-8))+'px';
      const px=lp.querySelector('.popx'); if(px) px.onclick=()=>{ lp.style.display='none'; };
      lp.querySelectorAll('.s').forEach(s2=>{ s2.onclick=e2=>{
        e2.stopPropagation(); if(s2.dataset.c) showK(s2.dataset.c, s2.dataset.n, e2, d);
      };});
    };
  });
  applyRvNote();
  renderLogic();            // v45：买入逻辑共性（全期统计，不随区间变化）
  renderCompare();          // 同区间两战法对比随明细一起刷新
}

/* v43：明细表冻结列偏移——「买入日」列实际宽度写入 CSS 变量，供「个股」列 left 吸附 */
function rvFreezeCols(){
  const tbl=document.querySelector('#rv-table table');
  if(!tbl) return;
  const th=tbl.querySelector('thead th');
  if(!th) return;
  const w=Math.round(th.getBoundingClientRect().width);
  if(w>0) tbl.style.setProperty('--fz1', w+'px');   // 隐藏页签下宽度为 0，跳过
}
window.addEventListener('resize', ()=>{ rvFreezeCols(); });

/* ================= v58：明日交易机会复盘 =================
   统计复盘决策「明日交易机会推荐」的全部推荐个股，模拟次日涨停买入后的盈亏：
   封住=收盘价买入 / 盘中触板=涨停价买入 / 一字买不进 / 未涨停不计；
   卖出与山顶洞人战法同规则（续板持有、-7%止损、未涨停尾盘卖、一字跌停顺延）。
   前端按 年/月/日 三段起止筛选统计。 */
let NR_FROM='', NR_TO='';
function nrDateStr(d){ return d?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8):''; }
function nrRecords(){ return (window.REVIEW.nextRecsBacktest||{}).records||[]; }
function nrInit(){
  const ds=(window.REVIEW.dates||[]).slice().sort();
  const first=ds[0]||'', last=ds[ds.length-1]||'';
  const fi=document.getElementById('nr-from'), ti=document.getElementById('nr-to');
  if(!fi||!ti) return;
  fi.min=ti.min=nrDateStr(first); fi.max=ti.max=nrDateStr(last);
  const cut=ds[Math.max(0,ds.length-250)]||first;
  fi.value=nrDateStr(cut); ti.value=nrDateStr(last);
  NR_FROM=cut; NR_TO=last;
  buildRvYmd(fi,'nr-f-ymd'); buildRvYmd(ti,'nr-t-ymd');
  const syncYmd=()=>{ ['nr-f-ymd','nr-t-ymd'].forEach(id=>{
    const h=document.getElementById(id); if(h&&h.__fromInput) h.__fromInput(); }); };
  const apply=()=>{
    NR_FROM=(fi.value||'').replace(/-/g,'')||first;
    NR_TO=(ti.value||'').replace(/-/g,'')||last;
    if(NR_FROM>NR_TO){ const x=NR_FROM; NR_FROM=NR_TO; NR_TO=x;
      fi.value=nrDateStr(NR_FROM); ti.value=nrDateStr(NR_TO); }
    syncYmd(); renderNextRecsBt();
  };
  const ok=document.getElementById('nr-ok'); if(ok) ok.onclick=apply;
  const al=document.getElementById('nr-all'); if(al) al.onclick=()=>{
    fi.value=nrDateStr(first); ti.value=nrDateStr(last);
    NR_FROM=first; NR_TO=last; syncYmd(); renderNextRecsBt(); };
  const ntg=document.getElementById('nr-note-tg');
  if(ntg) ntg.onclick=()=>{ const box=document.getElementById('nr-note');
    if(!box) return;
    const open=box.style.display==='none';
    box.style.display=open?'block':'none';
    ntg.textContent=open?'口径说明 · 点击收起 ▴':'口径说明 · 点击展开 ▾';
    if(open) box.innerHTML='<div class="sub" style="font-size:11.5px;line-height:1.8">'+
      ((window.REVIEW.nextRecsBacktest||{}).rule||'')+'</div>'; };
  renderNextRecsBt();
}
function renderNextRecsBt(){
  const recs=nrRecords().filter(x=>x.d>=NR_FROM&&x.d<=NR_TO);
  const sc=document.getElementById('nr-scope');
  if(sc) sc.textContent=rvDateStr(NR_FROM)+' ~ '+rvDateStr(NR_TO);
  const deals=recs.filter(x=>x.status==='成交'&&x.pnl!=null);
  const yiziN=recs.filter(x=>x.status==='一字买不进').length;

/* v18：同一时期各战法对比。区间、参与模拟（同日首笔）、仓位比例与上方明细表完全同源，
   指标口径也与单战法汇总一致：笔均盈利=盈利累加/盈利笔数、笔均亏损=亏损累加/亏钱笔数、
   盈亏比=|笔均盈利/笔均亏损|、模拟累积盈利=100% 起始资金按仓位复利后的盈亏百分点。*/
function renderCompare(){
  const host=document.getElementById('rv-cmp-box'); if(!host) return;
  const R=window.REVIEW, rv=R.review||{};
  const a=RV_FROM||'00000000', b=RV_TO||'99999999';
  const simEl=document.getElementById('rv-sim'), sim=!!(simEl&&simEl.checked);
  const posEl=document.getElementById('rv-pos');
  const pos=Math.max(1,Math.min(100,+(posEl&&posEl.value)||100));
  const sc=document.getElementById('rv-cmp-scope');
  if(sc) sc.textContent=rvDateStr(a)+' ~ '+rvDateStr(b)+
      (sim?' · 参与模拟（同日首笔 · 同股不加仓 · 仓位 '+pos+'%）':' · 全部逐笔');
  const MS=['summit'];
  const stat=m=>{
    let rows=(rv[m]||[]).filter(t=>t.d>=a&&t.d<=b);
    if(sim){ const seenDay=new Set(), held={}, dayIdx={}; let di=0;
      rows.slice().sort((x,y)=>x.d.localeCompare(y.d)).forEach(t=>{
        if(dayIdx[t.d]===undefined) dayIdx[t.d]=di++; });
      rows=rows.filter(t=>{ if(seenDay.has(t.d))return false; seenDay.add(t.d);
        const h=held[t.code];
        if(h!==undefined && dayIdx[t.d]<=h) return false;
        held[t.code]=dayIdx[t.d]+(t.hold||1); return true; }); }
    rows=rows.slice().sort((x,y)=>x.d.localeCompare(y.d)||x.code.localeCompare(y.code));
    const n=rows.length, wins=rows.filter(t=>t.pnl>0), loses=rows.filter(t=>t.pnl<0);
    const sum=arr=>arr.reduce((z,t)=>z+t.pnl,0);
    const avgWin=wins.length?sum(wins)/wins.length:0;
    const avgLose=loses.length?sum(loses)/loses.length:0;
    const winRate=n?wins.length/n*100:0;
    const pl=avgLose?Math.abs(avgWin/avgLose):0;
    let cap=100; rows.forEach(t=>cap*=(1+(t.pnl/100)*(pos/100)));
    return {m:m,n:n,winRate:winRate,avgWin:avgWin,avgLose:avgLose,
            pl:pl,cum:cap-100,cap:cap};
  };
  const S=MS.map(stat);
  const best=(key)=>{
    const vals=S.map(x=>x[key]).filter(v=>isFinite(v)&&v!==0);
    return vals.length?Math.max.apply(null,vals):null;
  };
  const bWR=best('winRate'), bAW=best('avgWin'), bPL=best('pl'), bCum=best('cum');
  const mk=(v,bv,dig,suf,plus)=>{
    const txt=(plus&&v>0?'+':'')+v.toFixed(dig)+(suf||'');
    return (bv!=null&&v===bv)?'<b style="color:'+C.gold+'">'+txt+'</b>':txt;
  };
  const cur=(document.getElementById('rv-method')||{}).value;
  let h='<table class="rv-tbl rv-cmp-tbl"><thead><tr>'+
    '<th class="l">战法</th><th>笔数</th><th>成功率</th><th>笔均盈利</th>'+
    '<th>笔均亏损</th><th>盈亏比</th><th>模拟累积盈利</th><th>期末净值</th>'+
    '</tr></thead><tbody>';
  S.forEach(x=>{
    h+='<tr'+(x.m===cur?' class="rv-cmp-cur"':'')+'>'+
      '<td class="l">'+(RV_MSHORT[x.m]||x.m)+'</td>'+
      '<td>'+x.n+'</td>'+
      '<td>'+mk(x.winRate,bWR,1,'%')+'</td>'+
      '<td style="color:'+C.up+'">'+mk(x.avgWin,bAW,2,'%',true)+'</td>'+
      '<td style="color:#2ebd85">'+x.avgLose.toFixed(2)+'%</td>'+
      '<td>'+(x.pl?mk(x.pl,bPL,2):'—')+'</td>'+
      '<td style="color:'+(x.cum>=0?C.up:'#2ebd85')+'">'+mk(x.cum,bCum,2,'%',true)+'</td>'+
      '<td>'+x.cap.toFixed(2)+'%</td></tr>';
  });
  h+='</tbody></table>'+
    '<div class="rv-cmp-tip">同一区间横向对比 · 金色为该项最优 · 紫色底为当前查看的战法。</div>'+
    kjNote('指标口径与上方明细完全一致（盈亏比 = 笔均盈利 / |笔均亏损|；模拟累积盈利按 100% 起始资金、'+
    '每笔 '+pos+'% 仓位复利）。切换起止日期 / 战法 / 参与模拟 / 仓位后自动刷新。', '口径 · 对比指标');
  host.innerHTML=h;
}

/* ================= v15：实盘导入 / 日K题材梯队 ================= */
const RV_MSHORT = {'summit':'山顶洞人'};
/* ---- 导入实盘数据 → 匹配各战法，分析平均实盘交易合理性 ---- */
function rrParse(text){
  const out=[];
  (text||'').split(/\r?\n/).forEach(line=>{
    line=line.trim();
    if(!line || /^(日期|date|#|\/\/)/i.test(line)) return;
    const parts=line.split(/[,，\t;；]+|\s{1,}/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2) return;
    let raw=parts[0].replace(/[\/\.]/g,'-'), d='';
    if(/^\d{8}$/.test(raw)) d=raw;
    else { const m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
           if(m) d=m[1]+String(m[2]).padStart(2,'0')+String(m[3]).padStart(2,'0'); }
    if(!d) return;
    const pctEl=parts.find(x=>/^[+-]?\d+(\.\d+)?%$/.test(x));
    let pnl=null;
    if(pctEl!=null) pnl=parseFloat(pctEl);
    else{
      const nums=parts.slice(1).filter(x=>/^\d+(\.\d+)?$/.test(x) && !/^\d{6}$/.test(x))
        .map(Number).filter(x=>isFinite(x)&&x>0);
      if(nums.length>=2) pnl=(nums[1]-nums[0])/nums[0]*100;
    }
    if(pnl==null || !isFinite(pnl)) return;
    const code=parts.find(x=>/^\d{6}$/.test(x))||'';
    const name=parts.find(x=>/[\u4e00-\u9fa5A-Za-z]/.test(x) && !/^\d/.test(x) && !/%$/.test(x))||'';
    out.push({d, code, name, pnl:Math.round(pnl*100)/100});
  });
  return out;
}
function rrAnalyze(trades){
  const R=window.REVIEW, rv=R.review||{}, ds=R.dates||[];
  const byKey={}, byCode={};
  Object.keys(rv).forEach(m=>(rv[m]||[]).forEach(t=>{
    (byKey[t.d+'|'+t.code]=byKey[t.d+'|'+t.code]||[]).push({m,t});
    (byCode[t.code]=byCode[t.code]||[]).push({m,t});
  }));
  const rows=trades.map(t=>{
    let hit=byKey[t.d+'|'+t.code]||[];
    const exact=hit.length>0;
    if(!exact && t.code){
      const i=ds.indexOf(t.d);
      hit=(byCode[t.code]||[]).filter(h=>{
        const j=ds.indexOf(h.t.d);
        return i>=0 && j>=0 && Math.abs(j-i)<=3;
      });
    }
    const sims=hit.map(h=>h.t.pnl);
    const avgSim=sims.length? sims.reduce((a,b)=>a+b,0)/sims.length : null;
    return {d:t.d, name:t.name||t.code||'—', pnl:t.pnl, exact,
            ms:[...new Set(hit.map(h=>h.m))], avgSim,
            dev: avgSim==null?null:t.pnl-avgSim};
  });
  const n=rows.length;
  const avg=n? rows.reduce((a,r)=>a+r.pnl,0)/n : 0;
  const wins=rows.filter(r=>r.pnl>0).length;
  const exactN=rows.filter(r=>r.exact).length;
  const cmp=rows.filter(r=>r.avgSim!=null);
  const avgDev=cmp.length? cmp.reduce((a,r)=>a+r.dev,0)/cmp.length : null;
  const rate=n? exactN/n*100 : 0;
  const kv2=(k,v,c)=>'<div class="kv"><span class="k">'+k+'</span>'+
    '<span class="v" style="color:'+(c||C.text)+'">'+v+'</span></div>';
  let html='<div class="rv-sum" style="margin-top:9px">'+
    kv2('实盘笔数',n)+kv2('平均盈亏',(avg>=0?'+':'')+avg.toFixed(2)+'%',avg>=0?C.up:'#2ebd85')+
    kv2('实盘胜率',(n?wins/n*100:0).toFixed(1)+'%')+
    kv2('符合战法比例',rate.toFixed(1)+'%',rate>=60?C.up:'#ffbd9e')+
    kv2('平均执行偏离',avgDev==null?'—':((avgDev>=0?'+':'')+avgDev.toFixed(2)+'%'),
        avgDev==null?C.dim2:(avgDev>=0?C.up:'#2ebd85'))+'</div>';
  let concl='共 '+n+' 笔实盘，其中 '+exactN+' 笔（'+rate.toFixed(1)+'%）在当日确实符合某战法买入条件；'+
    '实盘平均 '+(avg>=0?'+':'')+avg.toFixed(2)+'%。';
  if(avgDev==null) concl += ' 无可对照的模拟交易，建议补充代码或日期。';
  else{
    concl += '与对应战法模拟结果相比平均'+(avgDev>=0?'跑赢 ':'跑输 ')+
             Math.abs(avgDev).toFixed(2)+' 个百分点，';
    concl += (avgDev< -2?'卖点 / 买点执行明显偏弱，建议对照日K上的 B / S 点复盘。':'执行与模拟基本接近。');
  }
  concl += (rate<50?' 过半交易不在战法候选内，属于计划外交易，建议先收窄到战法内再谈优化。':
                    ' 多数交易在战法框架内，属于可复盘的执行差异。');
  html += '<div style="font-size:11px;line-height:1.8;color:#ffe08a;margin:6px 0">'+
    '合理性结论：'+(n===0?'暂无实盘记录。':concl)+'</div>';
  const grp={};
  cmp.forEach(r=>r.ms.forEach(m=>{
    const g=grp[m]=grp[m]||{n:0,real:0,sim:0};
    g.n++; g.real+=r.pnl; g.sim+=r.avgSim;
  }));
  if(Object.keys(grp).length){
    html += '<table><thead><tr><th class="l">战法</th><th>对照笔数</th><th>实盘均盈亏</th>'+
      '<th>模拟均盈亏</th><th>偏离</th></tr></thead><tbody>';
    Object.keys(grp).forEach(m=>{
      const g=grp[m], r=g.real/g.n, sm=g.sim/g.n;
      html += '<tr><td class="l">'+(RV_MSHORT[m]||m)+'</td><td>'+g.n+'</td>'+
        '<td>'+(r>=0?'+':'')+r.toFixed(2)+'%</td><td>'+(sm>=0?'+':'')+sm.toFixed(2)+'%</td>'+
        '<td>'+((r-sm)>=0?'+':'')+(r-sm).toFixed(2)+'%</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '<table><thead><tr><th class="l">日期</th><th class="l">个股</th><th>实盘盈亏</th>'+
    '<th class="l">匹配战法</th><th>模拟均盈亏</th><th>偏离</th><th class="l">判定</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr><td class="l">'+rvDateStr(r.d)+'</td><td class="l">'+r.name+'</td>'+
      '<td>'+(r.pnl>=0?'+':'')+r.pnl.toFixed(2)+'%</td>'+
      '<td class="l">'+(r.ms.length? r.ms.map(m=>RV_MSHORT[m]||m).join('、'):'—')+'</td>'+
      '<td>'+(r.avgSim==null?'—':((r.avgSim>=0?'+':'')+r.avgSim.toFixed(2)+'%'))+'</td>'+
      '<td>'+(r.dev==null?'—':((r.dev>=0?'+':'')+r.dev.toFixed(2)+'%'))+'</td>'+
      '<td class="l">'+(r.exact?'✓ 战法内':(r.avgSim!=null?'△ 同股邻近日':'✕ 计划外'))+'</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}
function rrInit(){
  const tg=document.getElementById('rr-toggle'), body=document.getElementById('rr-body');
  if(tg && body) tg.onclick=()=>{ body.style.display = body.style.display==='none'?'block':'none'; };
  const run=document.getElementById('rr-run'), clr=document.getElementById('rr-clear'),
        ta=document.getElementById('rr-text'), out=document.getElementById('rr-out'),
        st=document.getElementById('rr-state'), file=document.getElementById('rr-file');
  const doRun=txt=>{
    const trades=rrParse(txt);
    if(!trades.length){
      if(out) out.innerHTML='<div style="color:#ffbd9e;font-size:11px;padding:8px">未解析出有效记录，请检查格式。</div>';
      return;
    }
    try{ localStorage.setItem('sd_real', txt); }catch(e){}
    if(out) out.innerHTML=rrAnalyze(trades);
    if(st) st.textContent='已导入 '+trades.length+' 笔';
  };
  if(run) run.onclick=()=>doRun(ta?ta.value:'');
  if(clr) clr.onclick=()=>{ try{ localStorage.removeItem('sd_real'); }catch(e){}
    if(ta) ta.value=''; if(out) out.innerHTML=''; if(st) st.textContent='已清空'; };
  if(file) file.onchange=e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ if(ta) ta.value=String(rd.result||''); doRun(ta.value); };
    rd.readAsText(f,'utf-8');
  };
  try{
    const cached=localStorage.getItem('sd_real');
    if(cached && ta){ ta.value=cached; doRun(cached); }
  }catch(e){}
}

function skBucket(code){ let s=0; for(const c of code){ const n=+c; if(!isNaN(n)) s+=n; } return s%8; }
function stockKBars(code, atDate){

    const frag = o && o[code];
    if(frag && frag.length){
      frag.__frag = true;                 // 标记来自分片（数组自定义属性不影响遍历/序列化）
      SK_BARS[code] = frag;

  return first
    .catch(()=> fetch(onGHPages ? 'klines/klines_'+b+'.json?v='+KVER : RAW_KL)
                     .then(r=> r.ok ? r.json() : {}))
    .then(o=>{ SK_BUCKET[b] = o; return take(o); })

/* ---- 任意悬停提示框（ECharts tooltip）可拖动：拖住提示框移到任意位置 ---- */
function tipDrag(chart){
  if(!chart || chart.__tipBound) return;
  chart.__tipBound = true;
  const off = chart.__tipOff || (chart.__tipOff = {x:0, y:0});
  const dom = chart.getDom();
  const findTip = ()=>{
    const kids = dom.children || [];
    for(let i=kids.length-1;i>=0;i--){
      const el = kids[i];
      if(el.tagName==='DIV' && el.style && el.style.position==='absolute'
         && el.style.display!=='none' && el.offsetWidth>10) return el;
    }
    return null;
  };
  let drag = null;
  dom.addEventListener('mousedown', e=>{
    const tip = findTip();
    if(!tip || !tip.contains(e.target)) return;
    drag = {x:e.clientX, y:e.clientY};
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    off.x += dx; off.y += dy;
    const tip = findTip();
    if(tip){
      tip.style.left = (parseFloat(tip.style.left||0)+dx)+'px';
      tip.style.top  = (parseFloat(tip.style.top||0)+dy)+'px';
      tip.style.cursor = 'move';
    }
  });
  window.addEventListener('mouseup', ()=>{ drag=null; });
  dom.addEventListener('dblclick', ()=>{ off.x=0; off.y=0; });   // 双击复位
}

  const multi=await thsDayMinute(code, 8000);
  if(multi){

    if(mi>=0){ dayData=multi[mi];

      if(mi+1<multi.length && multi[mi+1].pts.length)
        prevFromMulti=multi[mi+1].pts[multi[mi+1].pts.length-1].price;
    }
  }

(async function initMpPop(){
  const pop=document.getElementById('mppop'), bar=document.getElementById('mppop-t');
  document.getElementById('mppop-x').onclick=()=>{ pop.style.display='none'; };
  let drag=null;
  const down=(x,y)=>{ drag={dx:x-pop.offsetLeft,dy:y-pop.offsetTop}; };
  bar.addEventListener('mousedown',e=>{ down(e.clientX,e.clientY); e.preventDefault(); });
  bar.addEventListener('touchstart',e=>{ const t=e.touches[0]; down(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    const W=window.innerWidth,H=window.innerHeight;
    pop.style.left=Math.max(0,Math.min(e.clientX-drag.dx,W-pop.offsetWidth))+'px';
    pop.style.top=Math.max(0,Math.min(e.clientY-drag.dy,H-pop.offsetHeight))+'px';
  });
  window.addEventListener('mouseup',()=>{ drag=null; });
})();

                 color:'#c9a6ff',fontSize:9},
          lineStyle:{color:'rgba(176,124,240,.65)',type:'dashed',width:1},
          data: dates.indexOf(OV.breakDate)>=0 ? [{xAxis:OV.breakDate}] : []}
      }] : [])
    ]
  }, {notMerge:true});
  renderKLad(code, target || dates[idx], trade && trade.theme, trade);
  tipDrag(kChart);
  /* v51：点日K任一蜡烛 → 弹该日分时走势（只显示时间/价格/涨幅，无开收价浮窗） */
  if(!kChart.__mpBound){
    kChart.__mpBound=true;
    kChart.on('click', p=>{
      if(p && p.seriesType==='candlestick' && p.dataIndex!=null){
        const dd=dates[p.dataIndex];
        if(dd) showMinute(code, name, dd, p.event && p.event.event);
      }
    });

}
/* 视口坐标 / 尺寸（弹窗定位与拖动用） */
function landXY(e){ return [e.clientX, e.clientY]; }
function landWH(){ return [window.innerWidth, window.innerHeight]; }
function positionK(e){
  const pop = document.getElementById('kpop');
  // e=null 表示「重绘已打开的K图」（刷新 / 每半小时自动更新）：保持原来的位置，不重新定位
  if(!e || e.clientX==null || e.clientY==null) return;
  const [cx, cy] = landXY(e);
  const [W, H] = landWH();
  let x = cx+16, y = cy-140;
  x = Math.max(8, Math.min(x, W-pop.offsetWidth-8));
  y = Math.max(8, Math.min(y, H-pop.offsetHeight-8));
  pop.style.left = x+'px'; pop.style.top = y+'px';
}
/* v68：日K浮层按视口收口——高度/宽度不超出可视区，位置夹回画面内，图表跟着重算尺寸。
   此前固定 760px/90vh，笔记本与小屏上底部日期轴、成交量被切在画面外「看不全」。 */
function fitK(){
  const pop = document.getElementById('kpop');
  if(!pop || pop.style.display === 'none') return;
  pop.style.width = ''; pop.style.height = '';      // 先清内联尺寸，按当前视口重新量
  const [W, H] = landWH();
  const maxW = Math.max(280, W - 16), maxH = Math.max(240, H - 16);
  if(pop.offsetWidth  > maxW) pop.style.width  = maxW + 'px';
  if(pop.offsetHeight > maxH) pop.style.height = maxH + 'px';
  const x = Math.max(6, Math.min(pop.offsetLeft, W - pop.offsetWidth  - 6));
  const y = Math.max(6, Math.min(pop.offsetTop,  H - pop.offsetHeight - 6));
  pop.style.left = x+'px'; pop.style.top = y+'px';
  if(kChart) kChart.resize();
}
function hideK(){
  document.getElementById('kpop').style.display='none';
  K_OVERLAY = null;                       // 关闭弹窗后不再保留叠加状态
  const b = document.getElementById('kov-btn');
  if(b){ b.style.display='none'; b.classList.remove('on'); }
}
/* ---- K线弹窗拖动（鼠标 + 触屏）---- */
let kPinned=false, kDrag=null;
(function initKDrag(){
  const pop = document.getElementById('kpop');
  const bar = document.getElementById('kpop-t');
  function down(x,y){
    kPinned = true;                       // 拖过后弹窗固定，不再随移出消失
    kDrag = {dx:x-pop.offsetLeft, dy:y-pop.offsetTop};
  }
  bar.addEventListener('mousedown', e=>{ const [cx,cy]=landXY(e); down(cx,cy); e.preventDefault(); });
  bar.addEventListener('touchstart', e=>{
    const t=e.touches[0]; const [cx,cy]=landXY(t); down(cx,cy); }, {passive:true});
  window.addEventListener('mousemove', e=>{
    if(!kDrag) return;
    const [cx,cy] = landXY(e); const [W,H] = landWH();
    pop.style.left = Math.max(0,Math.min(cx-kDrag.dx, W-pop.offsetWidth))+'px';
    pop.style.top  = Math.max(0,Math.min(cy-kDrag.dy, H-pop.offsetHeight))+'px';
  });
  window.addEventListener('touchmove', e=>{
    if(!kDrag) return;
    const t=e.touches[0]; const [cx,cy] = landXY(t); const [W,H] = landWH();
    pop.style.left = Math.max(0,Math.min(cx-kDrag.dx, W-pop.offsetWidth))+'px';
    pop.style.top  = Math.max(0,Math.min(cy-kDrag.dy, H-pop.offsetHeight))+'px';
  }, {passive:true});
  window.addEventListener('mouseup', ()=>{kDrag=null;});
  window.addEventListener('touchend', ()=>{kDrag=null;});
  document.getElementById('kpop-x').onclick = ()=>{kPinned=false; hideK();};
  // 鼠标移入弹窗 → 固定显示，不再随离开个股卡而消失（可拖动/查看）
  pop.addEventListener('mouseenter', ()=>{kPinned=true;});
})();
/* ---- 图表悬停信息框（tooltip 为 DOM）右上角 ✕ 点击关闭 ---- */
document.addEventListener('click', e=>{

/* ================= v71：还原各模块历史时间选择（v70 全删，按用户要求恢复） =================
   空间情绪 / 题材炒作：年月日 + 确定 的独立日期控件；
   连板梯队：上一交易日 / 日期下拉 / 下一交易日 / 今日；
   今日复盘：回看截止日 ◀/下拉/▶/最新（下面三块跟随该日）。 */
let histDate = null;
const MODS = ['market','theme','ladder'];  // 拥有独立日期控件的模块
const MOD_DATE = {};               // 每个模块各自选定的日期，互不影响

/* 空间情绪模块：主图窗口对准该日 + 摘要 + 明细表跳转 */
function focusMarket(date){
  const R = window.REVIEW, days = R.stages;
  const idx = days.findIndex(x=>x.date===date);
  if(idx >= 0 && mktChart){
    const dz = (mktChart.getOption().dataZoom||[])[0] || {start:0,end:100};
    let cnt = Math.max(3, Math.round((dz.end-dz.start)/100*days.length));
    cnt = Math.min(cnt, days.length);
    let s = 100*(idx-cnt+1)/days.length, e = 100*(idx+1)/days.length;
    if(s < 0){ s = 0; e = 100*cnt/days.length; }
    mktChart.dispatchAction({type:'dataZoom', start:s, end:e});
  }
  jumpTableTo(date);
}
/* 目标日期不在当前「近1月/近3月」范围时自动放宽，保证该日一定有行可跳 */
function ensureRange(mod, date){
  const all = (window.REVIEW.dates||[]).slice().sort();
  const i = all.indexOf(date);
  if(i < 0) return;
  const need = all.length - i;
  if(mod==='theme' && THEME_RANGE < need) THEME_RANGE = need<=90 ? 90 : 9999;
}
/* 明细表跳转后高亮（保留：点空间情绪明细表行时仍用） */
function scrollFlash(selector){
  const el = document.querySelector(selector);
  if(!el) return;
  setTimeout(()=>{
    if(el.scrollIntoView) el.scrollIntoView({block:'center'});
    el.classList.remove('dp-flash');
    void el.offsetWidth;                 // 重启动画
    el.classList.add('dp-flash');
    setTimeout(()=>el.classList.remove('dp-flash'), 1700);
  }, 40);
}
function highlightDate(date){
  document.querySelectorAll('.dp-hl').forEach(el=>el.classList.remove('dp-hl'));
  if(!date) return;
  document.querySelectorAll('[data-d="'+date+'"]').forEach(el=>{
    if(el.tagName === 'BUTTON' || el.classList.contains('tdate')) return;
    el.classList.add('dp-hl');
  });
}
/* v67：题材炒作页显示当日市场阶段（空间龙头四阶段，与空间情绪图同源）。
   v71：跟随该模块已选日期（默认最新交易日）。 */
function paintDpStage(mod, dt){
  const el = document.getElementById('dp-stg-'+mod);
  if(!el) return;
  const st = ((window.REVIEW||{}).stages||[]).find(x=>x.date===dt) || {};
  const STG = {'节点':'#9fe3e0','补涨':'#ffd24a','突破':'#f5455c','主升':'#a55eea'};
  const s = st.stage || '';
  const col = STG[s] || '#78849a';
  el.innerHTML = s
    ? '<span style="display:inline-block;margin-left:8px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;'+
      'background:'+col+'22;border:1px solid '+col+'66;color:'+col+
      '" title="当日市场阶段（空间龙头四阶段，与空间情绪图同源）">市场阶段 · '+s+'</span>'
    : '';
}
function latestDate(){ const ds=((window.REVIEW||{}).dates||[]).slice().sort(); return ds[ds.length-1]||''; }
/* v72：市场阶段日期映射（空间龙头四阶段，供题材明细行 / 热力表列头标注） */
let _STG_MAP = null;
function stageMap(){

  const m = {};

/* 生成一个模块独立的「年 / 月 / 日 + 确定」控件（v71 还原） */
function buildDPick(mod){
  const host = document.getElementById('dp-'+mod);
  if(!host) return;
  const ds = ((window.REVIEW||{}).dates||[]).slice().sort();
  if(!ds.length) return;
  const years = [...new Set(ds.map(x=>x.slice(0,4)))].sort();
  host.innerHTML = '<span class="dp-lb">本模块日期</span>'+
    '<select class="dp-y">'+years.map(v=>'<option value="'+v+'">'+v+'年</option>').join('')+'</select>'+
    '<select class="dp-m"></select><select class="dp-d"></select>'+
    '<button class="dp-go">确定</button><span class="dp-now"></span>'+
    '<span class="dp-stg" id="dp-stg-'+mod+'"></span>';
  const y=host.querySelector('.dp-y'), m=host.querySelector('.dp-m'),
        d=host.querySelector('.dp-d'), go=host.querySelector('.dp-go'),
        now=host.querySelector('.dp-now');
  const fillM = keep=>{
    const ms=[...new Set(ds.filter(x=>x.startsWith(y.value)).map(x=>x.slice(4,6)))].sort();
    m.innerHTML=ms.map(v=>'<option value="'+v+'">'+(+v)+'月</option>').join('');
    if(keep && ms.includes(keep)) m.value=keep;
    fillD();
  };
  const fillD = keep=>{
    const list=ds.filter(x=>x.startsWith(y.value+m.value));
    d.innerHTML=list.map(v=>'<option value="'+v+'">'+(+v.slice(6))+'日</option>').join('');
    if(keep && list.includes(keep)) d.value=keep;
  };
  y.value = years[years.length-1];
  fillM(); fillD();
  y.onchange = ()=>fillM();
  m.onchange = ()=>fillD();
  host.__setDate = dt=>{
    if(!dt || !ds.includes(dt)) return;
    y.value=dt.slice(0,4); fillM(dt.slice(4,6)); fillD(dt);
    now.textContent='当前 '+fmtDate(dt);
    MOD_DATE[mod]=dt;
    paintDpStage(mod, dt);       // 题材页日期旁显示当日市场阶段
  };
  go.onclick = ()=>focusModule(mod, d.value);
  const initD = ds[ds.length-1];         // 模块默认最新交易日
  host.__setDate(initD);
}
/* 单个模块跳到指定日期（只影响该模块，其它模块保持各自已选日期） */
function focusModule(mod, date){
  if(!date || !((window.REVIEW.dates||[]).includes(date))) return;
  MOD_DATE[mod] = date;
  const host = document.getElementById('dp-'+mod);
  if(host && host.__setDate) host.__setDate(date);
  if(mod==='market')       focusMarket(date);
  else if(mod==='theme'){  ensureRange('theme', date); renderTheme(); scrollFlash('#theme-list .trow[data-d="'+date+'"]'); }
  else if(mod==='ladder'){ renderLadder(date); }
  highlightDate(date);          // 必须在重绘之后，否则新 DOM 上没有高亮
}
function initModuleDates(){ MODS.forEach(buildDPick); }

/* ================= 复盘决策页（v38 简化，v42 扩展） =================
   ① 今日市场阶段 + 交易机会判断：上一空间龙头断板后无大亏（跌停/连续杀跌）
      → 情绪较好；断板直接大亏 → 提示风险；默认内嵌展示该龙头断板后日K；
   ② 赚钱效应题材梯队（板块有 3 板龙头）：连板股给涨停时间 + 涨停形态
      （一字/T字/换手），首板只报数量；昨日次高板断板股给今日涨跌幅；
   ③（v41/v42）昨日涨停 → 今日赚钱效应：只列有具体题材的板块，每组给个股明细
      （今日连板高度 / 涨停时间 / 涨跌幅，可点日K），识别人气板块；
   ④（v42）活跃股池：近 10 日涨停 ≥5 次、近两日无跌停，按题材分组排列。 */
/* ================= v70 赚钱效应页（今日复盘） =================
   v70 用户口径改动：
   ① 个股显示涨停时间；炸板显示「炸板」（抓到首封时间也一起显示）
   ② 赚钱效应个股的题材后带当日该题材梯队（4-2-1 / 3-1-1）
   ③ 题材首封时间图左对齐、比例可缩放、可拖动（仅此图）
   ④ 多题材热力图改为「每题材每天涨停家数与梯队」表图，左对齐
   ⑤ 历史回看日期已删除，页面固定最新交易日 */
let EP_W = 1;                      // 统计窗口（1/3/5 日）
let EP_END = null;                 // v71：历史回看截止日（null＝最新交易日）
const EP_NUM = v => v==null ? '—' : (v>0?'+':'')+v.toFixed(2)+'%';

function epDays(){ return ((window.REVIEW||{}).dates||[]).slice().sort(); }
function epEndDate(){
  const ds = epDays(), last = ds[ds.length-1] || '';
  return (EP_END && ds.includes(EP_END)) ? EP_END : last;
}
/* v71：回看截止日下拉（全部交易日倒序）+ 前后步进 */
function epFillDates(end){
  const sel = document.getElementById('ep-date');
  if(!sel) return;
  const ds = epDays();
  if(sel.options.length !== ds.length)
    sel.innerHTML = ds.slice().reverse().map(d=>'<option value="'+d+'">'+fmtDate(d)+'</option>').join('');
  sel.value = end;
}
function epStepDate(n){
  const ds = epDays();
  if(!ds.length) return;
  const cur = epEndDate();
  const i = ds.indexOf(cur);
  EP_END = ds[Math.max(0, Math.min(ds.length-1, i+n))];
  paintEarn();
}

/* 当日涨停：dayZT[d][code] = [name, 首封 HH:MM, 涨停形态] */
function ztOf(d, code){
  const m = (((window.REVIEW||{}).dayZT||{})[d] || {});
  const v = m[String(code)];
  return v ? {t: v[1] || '', s: v[2] || ''} : null;
}
/* 当日炸板：dayZB[d][code] = [name, 首封 HH:MM, 当日涨幅] */
function zbOf(d, code){
  const m = (((window.REVIEW||{}).dayZB||{})[d] || {});
  const v = m[String(code)];
  return v ? {t: v[1] || '', chg: v[2]} : null;
}
/* 个股当日状态小标：涨停 → 首封时间；炸板 → 「炸板 + 首封时间」；都不是返回空 */
function stateTag(d, code){
  const z = ztOf(d, code);
  if(z) return '<i class="stk-zt" title="当日涨停 · 首封 '+(z.t||'—')+(z.s? ' · '+z.s : '')+'">'+
    (z.t || '涨停')+'</i>';
  const b = zbOf(d, code);
  if(b) return '<i class="stk-zb" title="当日炸板（盘中曾涨停、收盘未封住）'+
    (b.t? ' · 首封 '+b.t : '')+'">炸板'+(b.t? ' '+b.t : '')+'</i>';
  return '';
}
/* 题材当日梯队字符串：优先 ladders.ladder，缺失用 ladderFull 板位集合现算 */
function tierOf(d, nm){
  if(!nm) return '';
  const R = window.REVIEW || {};
  const le = ((R.ladders||{})[d]||{})[tName(nm)];
  if(le && le.ladder) return le.ladder;
  const arr = (((R.ladderFull||{})[d]||{})[tName(nm)]) || [];
  if(!arr.length) return '';
  return [...new Set(arr.map(s=>s.boards||1))].sort((a,b)=>b-a).join('-');
}

/* ① 赚钱效应名单：个股（板位/缺口/当日状态） + 题材（当日梯队） */
function paintEarn(){
  const root = document.getElementById('es-root');
  if(!root) return;
  const E = (window.REVIEW||{}).earnStreak || {};
  const evsAll = E.eventsAll || [];
  const ds = epDays(), last = ds[ds.length-1] || '';
  const end = epEndDate();
  const ei = ds.indexOf(end);
  const start = ds[Math.max(0, ei-EP_W+1)] || end;
  epFillDates(end);
  document.querySelectorAll('.ep-w').forEach(b=>b.classList.toggle('on', +b.dataset.w===EP_W));
  const hd = document.getElementById('ep-hd'), rg = document.getElementById('ep-range');
  if(hd) hd.textContent = '近 '+EP_W+' 个交易日 · 连续两日换手赚钱机会个股（3板或以上）'+
    (end && end!==last ? ' · 回看 '+fmtDate(end) : '');
  if(rg) rg.textContent = fmtDate(start)+' ~ '+fmtDate(end)+(end!==last ? '（历史回看）' : '');

  const best = {};
  for(const e of evsAll){
    if(e.d < start || e.d > end) continue;
    if(!best[e.code] || e.d > best[e.code].d) best[e.code] = e;
  }
  const evs = Object.values(best)
    .sort((a,b)=> b.d.localeCompare(a.d) || b.b-a.b || a.code.localeCompare(b.code));
  let h = '';
  if(!evs.length){
    h = '<div class="sub" style="padding:10px 2px">'+fmtDate(start)+' ~ '+fmtDate(end)+' 暂无达标个股。</div>';
  } else {
    const by = {};
    evs.forEach(e=>{ (by[e.d]||(by[e.d]=[])).push(e); });
    Object.keys(by).sort((a,b)=>b.localeCompare(a)).forEach(d=>{
      const arr = by[d];
      h += '<div class="ep-dayh">'+fmtDate(d)+' · 达标 <b>'+arr.length+'</b> 只</div><div class="ep-rows">'+
        arr.map(e=>{
          const g = e.gapT ? '<i class="gap">缺口</i>' : (e.gap1 ? '<i class="gapi">前日缺口</i>' : '');
          const tier = e.theme ? tierOf(e.d, e.theme) : '';
          return '<span class="ep-ch" data-c="'+e.code+'" data-n="'+e.name+'" data-d="'+e.d+'" '+
            'title="'+e.name+' '+e.b+'板 · 点看日K（箭头指 '+fmtDate(e.d)+'）">'+
            '<b>'+e.name+'</b><em class="b">'+e.b+'板</em>'+g+stateTag(e.d, e.code)+
            '<span class="th" data-th="'+(e.theme||'')+'" data-d="'+e.d+'"'+
            (e.theme? ' title="点看 '+fmtDate(e.d)+'「'+e.theme+'」当日梯队"':' title="当日无复盘题材归类"')+'>'+
            (e.theme||'—')+(tier? '<em class="tier">'+tier+'</em>':'')+'</span></span>';
        }).join('')+'</div>';
    });
  }
  root.innerHTML = h;
  root.querySelectorAll('.ep-ch').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation(); showK(el.dataset.c, el.dataset.n, ev, el.dataset.d); };
  });
  root.querySelectorAll('.ep-ch .th').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation();
      if(!el.dataset.th){ toast('该股当日无复盘题材归类'); return; }
      openLadPop(el.dataset.th, el.dataset.d, ev);
    };
  });
  paintRelay(end);
  paintSeal(end);
  paintHeat(end);
}

/* ② 昨日梯队 → 今日反馈：龙头（最高板）/ 助攻（次级连板）/ 跟风（首板）逐股涨幅 + 晋级 + 当日状态 */
function paintRelay(d){
  const host = document.getElementById('ep-fb');
  if(!host) return;
  const F = (window.REVIEW||{}).relayFb || {};
  const rows = (F.days||{})[d] || [];
  const ds = epDays(), i = ds.indexOf(d), dp = i>0 ? ds[i-1] : '';
  const hd = document.getElementById('ep-fb-h');
  if(hd) hd.innerHTML = '昨日梯队 → 今日反馈 <span class="sub">'+
    (dp? fmtDate(dp)+' 梯队 → '+fmtDate(d)+' 表现' : '')+
    ' · 龙头＝最高板 / 助攻＝低于龙头的连板 / 跟风＝首板</span>';
  if(!rows.length){
    host.innerHTML = '<div class="sub" style="padding:8px 2px">'+
      (dp? '无昨日梯队数据' : '无上一交易日')+'</div>';
    return;
  }
  /* v71：角色三色——龙头金 / 助攻紫 / 跟风蓝；左栏昨日涨停反馈、右栏题材今日梯队 */
  const ROLE_COL = {'龙头':'#f0b90b', '助攻':'#a55eea', '跟风':'#3d8bff'};
  const roleTxt = c=> c==='龙头' ? '#0b1220' : '#fff';
  const LF = ((window.REVIEW||{}).ladderFull||{})[d] || {};
  const todayLad = th=> LF[th] || LF[tName(th)] || [];
  host.innerHTML = rows.map(r=>{
    const L = r.L.map(l=>{
      const rc = ROLE_COL[l.role] || '#7f8ea6';
      const chips = (l.st||[]).map(x=>{
        const mark = x[4]===1 ? '<i class="ok">晋级</i>' : (x[4]===0 ? '<i class="no">未晋级</i>' : '<i class="na">—</i>');
        const col = x[3]==null ? C.dim2 : (x[3]>=0 ? C.up : C.down);
        return '<span class="fbst" data-c="'+x[1]+'" data-n="'+x[0]+'" data-d="'+d+'" '+
          'title="'+x[0]+'：昨日 '+x[2]+' 板 → 今日 '+EP_NUM(x[3])+'（'+(x[4]===1?'晋级':(x[4]===0?'未晋级':'无数据'))+'）｜点看日K">'+
          x[0]+'<em class="y">'+x[2]+'板</em>'+
          '<em class="c" style="color:'+col+'">'+EP_NUM(x[3])+'</em>'+mark+stateTag(d, x[1])+'</span>';
      }).join('');
      return '<div class="fbl"><span class="fbrole" style="background:'+rc+';color:'+roleTxt(l.role)+'">'+l.role+'</span>'+
        '<span class="fbb">'+l.b+'板</span>'+
        '<span class="fbstat">均 '+EP_NUM(l.avg)+' · 赚 '+(l.win==null?'—':l.win+'%')+
        ' · 晋级 '+l.pr+'/'+(l.st||[]).length+'</span>'+
        '<div class="fbsts">'+chips+'</div></div>';
    }).join('');
    /* 右栏：题材今日梯队（按板位分行；最高板＝龙头、次级连板＝助攻、首板＝跟风）
       v71：优先用后端 tl（昨日成员今日仍涨停 + 当日映射同题材新增），
       兜底用 ladderFull 当日该题材完整梯队 */
    const arr = (r.tl && r.tl.length) ? r.tl : todayLad(r.th);
    const byB = {};
    arr.forEach(s=>{ const bd=(s&&s.boards)||1; (byB[bd] || (byB[bd]=[])).push(s); });
    const boards = Object.keys(byB).map(Number).sort((a,b)=>b-a);
    const lad = boards.length ? boards.map(bd=>{
      const role = bd===boards[0] ? '龙头' : (bd>=2 ? '助攻' : '跟风');
      const rc = ROLE_COL[role] || '#7f8ea6';
      return '<div class="ladrow"><span class="ladb" style="color:'+rc+'">'+role+' '+bd+'板</span><span class="ladst">'+
        byB[bd].map(s=>'<span class="fbst" data-c="'+(s.code||'')+'" data-n="'+(s.name||'')+'" data-d="'+d+'" '+
          'title="'+(s.name||'')+'：今日 '+bd+'板（'+role+'）'+(s.t? ' · 首封 '+s.t:'')+
          (s.s? ' · '+s.s:'')+' ｜点看日K">'+(s.name||'')+
          '<em class="y">'+bd+'板</em>'+stateTag(d, s.code)+'</span>').join('')+
        '</span></div>';
    }).join('') : '<span class="sub" style="padding:4px 0">今日该题材无梯队</span>';
    return '<div class="fbcard"><div class="fbhd"><b>'+r.th+'</b>'+
      '<span class="sub">昨日最高 '+r.top+' 板 · 梯队 '+r.cnt+' 只</span></div>'+
      '<div class="fbcols"><div class="fbL">'+L+'</div>'+
      '<div class="fbR"><div class="fbR-hd">题材今日梯队 · '+fmtDate(d)+'</div>'+lad+'</div></div></div>';
  }).join('');
  host.querySelectorAll('.fbst').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation(); showK(el.dataset.c, el.dataset.n, ev, el.dataset.d); };
  });
}

/* ③ 题材首封时间图（纯 CSS 时间轨道）——左对齐 + 可缩放 + 可拖动（仅此图） */
function paintSeal(d){
  const host = document.getElementById('ep-seal');
  if(!host) return;
  const R = window.REVIEW || {};
  const LF = (R.ladderFull||{})[d] || {};
  const ZB = (R.dayZB||{})[d] || {};
  const ZBT = (R.zbTheme||{})[d] || {};
  const ds = epDays(), di = ds.indexOf(d), dp = di>0 ? ds[di-1] : '';
  /* v72：昨日已出现的赚钱效应题材集合——今日新入列的题材标「新」 */
  const prevTh = new Set(Object.keys(dp ? ((R.ladderFull||{})[dp]||{}) : {}));
  const ths = Object.keys(LF).filter(nm=>(LF[nm]||[]).length)
    .sort((a,b)=> (LF[b].length - LF[a].length) || a.localeCompare(b));
  if(!ths.length){
    host.style.height = 'auto';
    host.innerHTML = '<div class="sub" style="padding:8px 2px">'+fmtDate(d)+' 当日无赚钱效应题材</div>';
    return;
  }
  const chip = (s, rk)=>{
    const b = s.boards||1;
    const t = s.t || '';
    return '<span class="sl-stk rk-'+rk+'" data-c="'+(s.code||'')+'" data-n="'+(s.name||'')+'" data-d="'+d+'" '+
      'title="'+(s.name||'')+'：'+(rk==='zb'?'炸板':'首封 '+ (t||'—'))+' · '+(rk==='zb'?'当日涨幅 '+s.chg+'%':(b>=2? b+'板':'首板'))+
      (s.s? ' · '+s.s:'')+' ｜点看日K">'+(s.name||'')+
      '<em>'+(rk==='zb'?'炸板':(b>=2? b+'板':'首板'))+'</em>'+
      (t? '<span class="t">'+t+'</span>':'')+'</span>';
  };
  let h = '<div class="sl-tbl-wrap"><table class="sl-tbl"><thead><tr>'+
    '<th class="sl-th">题材＼角色</th>'+
    '<th class="sl-th" style="color:#f0b90b">龙头（最高板）</th>'+
    '<th class="sl-th" style="color:#a55eea">助攻（次级连板）</th>'+
    '<th class="sl-th" style="color:#3d8bff">跟风（首板）</th>'+
    '<th class="sl-th" style="color:#2ebd85">炸板</th>'+
    '</tr></thead><tbody>';
  ths.forEach(nm=>{
    const arr = LF[nm];
    const top = Math.max.apply(null, arr.map(s=>s.boards||1));
    const col = T_COLOR[tName(nm)] || C.blue;
    const lead = arr.filter(s=>(s.boards||1)===top);
    const mid  = arr.filter(s=>{ const b=s.boards||1; return b>=2 && b<top; });
    const fir  = arr.filter(s=>(s.boards||1)===1);
    const zbs  = Object.keys(ZB).filter(c=>ZBT[c]===nm)
      .map(c=>({code:c, name:ZB[c][0], t:ZB[c][1], chg:ZB[c][2], boards:0}));
    const cell = (list, rk)=>{
      const inner = list.length
        ? list.map(s=>chip(s, rk)).join('')
        : '<span style="color:'+C.dim2+'">—</span>';
      return '<td><div class="sl-cell">'+inner+'</div></td>';
    };
    const isNew = !prevTh.has(nm);
    h += '<tr><th class="sl-rh" style="color:'+col+'" title="'+nm+'：涨停 '+arr.length+
      ' 只'+(zbs.length? ' · 炸板 '+zbs.length+' 只':'')+(isNew?' · 今日新赚钱效应题材':'')+'">'+nm+
      (isNew? '<em class="sl-new">新</em>':'')+'<i>'+arr.length+'</i></th>'+
      cell(lead,'ld') + cell(mid,'zg') + cell(fir,'gf') + cell(zbs,'zb') +
      '</tr>';
  });
  h += '</tbody></table></div>'+
    '<div class="seal-note">行＝当日赚钱效应题材（按涨停家数降序，绿标「新」＝昨日未入列的今日新赚钱效应题材）；'+
    '列＝龙头（最高板）/ 助攻（低于龙头的连板）/ 跟风（首板）/ 炸板（盘中曾涨停未封住，绿标）；'+
    '个股后为首次涨停时间 · 龙头金 / 助攻紫 / 跟风蓝 / 炸板绿 · 点个股看日K。</div>';
  host.style.height = 'auto';
  host.innerHTML = h;
  host.querySelectorAll('.sl-stk').forEach(el=>{
    el.onclick = ev=>{ ev.stopPropagation();
      if(el.dataset.c) showK(el.dataset.c, el.dataset.n, ev, el.dataset.d); };
  });
}

/* ④ 多题材热力表（行＝题材，列＝交易日，格内＝涨停家数 + 梯队）+ 跨题材归类 */
function paintHeat(d){
  const host = document.getElementById('ep-heat'), cross = document.getElementById('ep-cross');
  if(!host) return;
  const R = window.REVIEW || {};
  const ds = epDays();
  const ei = ds.indexOf(d);
  if(ei < 0){ host.innerHTML = ''; return; }
  const LF = R.ladderFull || {};
  const HC = 12, CC = 20;
  const hd = ds.slice(Math.max(0, ei-HC+1), ei+1);
  const cd = ds.slice(Math.max(0, ei-CC+1), ei+1);
  const STGD = stageMap();                      // v72：列头日期下的当日市场阶段

  /* v71：题材「出现」口径 = 当日板块有连板（≥2板）且涨停 ≥3 家；
     热力表只统计窗口内出现 ≥3 次的题材 */
  const thCnt = {}, thDay = {}, thQ = {}, codeTh = {}, nameOf = {};
  hd.forEach(x=>{
    const day = LF[x] || {};
    Object.keys(day).forEach(nm=>{
      const arr = day[nm] || [];
      thCnt[nm] = (thCnt[nm] || 0) + arr.length;
      (thDay[nm] || (thDay[nm] = {}))[x] = arr.length;
      if(arr.length >= 3 && arr.some(s=>(s.boards||1) >= 2))
        thQ[nm] = (thQ[nm] || 0) + 1;
    });
  });
  cd.forEach(x=>{
    const day = LF[x] || {};
    Object.keys(day).forEach(nm=>(day[nm] || []).forEach(s=>{
      const c = String(s.code || '');
      if(!c) return;
      (codeTh[c] || (codeTh[c] = {}))[nm] = (codeTh[c][nm] || 0) + 1;
      nameOf[c] = s.name || c;
    }));
  });

  /* 跨题材归类：窗口内被 ≥2 个题材炒过的个股 */
  if(cross){
    const multi = Object.keys(codeTh).filter(c=>Object.keys(codeTh[c]).length>=2)
      .sort((a,b)=> Object.keys(codeTh[b]).length - Object.keys(codeTh[a]).length);
    if(!multi.length){
      cross.innerHTML = '<div class="sub" style="padding:6px 2px">近 '+cd.length+
        ' 个交易日无个股被多个题材炒过。</div>';
    } else {
      const grp = {};
      multi.forEach(c=>{
        const k = Object.keys(codeTh[c]).sort((a,b)=> codeTh[c][b]-codeTh[c][a]).join(' + ');
        (grp[k] || (grp[k] = [])).push(nameOf[c]);
      });
      const keys = Object.keys(grp).sort((a,b)=> grp[b].length-grp[a].length || a.localeCompare(b));
      cross.innerHTML = '<div class="cross-hd">跨题材归类 · 近 '+cd.length+' 个交易日有 '+
        multi.length+' 只个股被 ≥2 个题材炒过</div>'+
        keys.map(k=>'<div class="cross-row"><span class="cth">'+k+'</span><span class="cst">'+
          grp[k].map(n=>'<i>'+n+'</i>').join('')+'</span></div>').join('');
    }
  }

  const rowTh = Object.keys(thCnt).filter(nm=> (thQ[nm]||0) >= 3)
    .sort((a,b)=> thCnt[b]-thCnt[a] || a.localeCompare(b)).slice(0, 14);
  if(!rowTh.length){
    host.style.height = 'auto';
    host.innerHTML = '<div class="sub" style="padding:8px 2px">'+fmtDate(d)+
      ' 近端无「出现 ≥3 次（板块有连板且涨停 ≥3 家）」的题材。</div>';
    return;
  }
  let mx = 1;
  rowTh.forEach(nm=> hd.forEach(day=>{ const v=(thDay[nm]||{})[day]||0; if(v>mx) mx=v; }));
  /* 每天全市场涨停家数（dayZT 覆盖近 25 日，足够 12 列） */
  const ztCnt = x=> Object.keys(((R.dayZT||{})[x])||{}).length;
  let html = '<div class="ht-tbl-wrap"><table class="ht-tbl"><thead><tr>'+
    '<th class="ht-th">题材＼日</th>'+
    hd.map(x=>{
      const st = STGD[x];
      return '<th class="ht-ch">'+fmtDate(x)+
        (st? '<i style="color:'+STAGE_SOLID[st]+'" title="当日市场阶段（空间龙头四阶段）">'+st+'</i>':'')+
        '</th>';
    }).join('')+'</tr></thead><tbody>';
  rowTh.forEach(nm=>{
    const col = T_COLOR[tName(nm)] || C.blue;
    html += '<tr><th class="ht-rh" style="color:'+col+'" title="'+nm+'：窗口内共涨停 '+thCnt[nm]+
      ' 只 · 出现 '+(thQ[nm]||0)+' 次">'+nm+'</th>';
    hd.forEach(day=>{
      const v = (thDay[nm]||{})[day] || 0;
      if(!v){ html += '<td class="ht-cell"></td>'; return; }
      const tier = tierOf(day, nm);
      const a = (0.18 + 0.72*v/mx).toFixed(2);
      html += '<td class="ht-cell" style="background:'+col+';opacity:'+a+
        '" title="'+nm+' · '+fmtDate(day)+'：涨停 '+v+' 只'+(tier? ' · 梯队 '+tier : '')+'">'+
        '<b>'+v+'</b>'+(tier? '<i>'+tier+'</i>':'')+'</td>';
    });
    html += '</tr>';
  });
  html += '<tr class="ht-sum"><th class="ht-rh">全市场涨停</th>'+
    hd.map(x=>'<td class="ht-cell ht-tot">'+(ztCnt(x)||'')+'</td>').join('')+'</tr>';
  html += '</tbody></table></div>'+
    '<div class="seal-note">行＝题材（仅统计窗口内出现 ≥3 次的题材：当日板块有连板且涨停 ≥3 家；'+
    '按窗口内涨停总数排序，top14）· 列＝最近 '+hd.length+
    ' 个交易日 · 格内上行为当日该题材涨停家数、下行为梯队（板位从高到低）· 底色越亮家数越多；'+
    '末行为当日全市场涨停家数。</div>';
  host.style.height = 'auto';
  host.innerHTML = html;
}

function applyDayPool(ds, stocks){

  stocks.forEach(s=>{

  Object.keys(grp).forEach(nm=>{

  R.lb = R.lb||{}; R.lb[ds] = lbr;

  // v43 入链门槛：板块有连板（≥2板）且板块涨停 >3 只；家数是准确值，不再做约等于估算。

      });

  return {lad, lbr};

    const tm = setTimeout(()=>{ try{ if(ctl) ctl.abort(); }catch(e){} }, ms||7000);

    for(let round=0; round<2; round++){
      for(const px of PROXIES){
        if(deadline && Date.now()>deadline) return null;
        try{

      btn.textContent = '⟳ 刷新失败';
    }
    btn.disabled = false;               // 按钮立刻可再点，不再卡住其他交互
    setTimeout(()=>{btn.textContent='⟳ 刷新';}, 2500);
  };
  /* ---- 视口尺寸变化：重算顶栏高度并重绘图表 ---- */
  window.addEventListener('resize', ()=>{
    const hd = document.querySelector('header');
    document.documentElement.style.setProperty('--hdr', (hd? hd.offsetHeight : 29)+'px');
    const nv = document.getElementById('nav');
    if(nv) document.documentElement.style.setProperty('--navh', nv.offsetHeight+'px');
    if(mktChart) mktChart.resize(); if(kChart) kChart.resize();
    fitK();                       // v68：视口变化后日K浮层重新收口（含位置夹回）
  });

  /* ---- 历史定位下拉已取消（v70） ---- */
  /* ---- 右下角返回顶端（点击平滑滚回，顶部标题栏/导航固定可见） ---- */
  document.getElementById('backtop').onclick = ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    const tl = document.getElementById('theme-list');
    if(tl) tl.scrollTop = 0;
    const mt = document.getElementById('mkt-table');
    if(mt) mt.scrollTop = 0;
  };
  /* ---- 日K：每半小时自动拉取最新（仅刷新已打开的K图，避免无谓请求） ---- */
  setInterval(()=>{
    LIVE_K = true;
    if(lastK && document.getElementById('kpop').style.display==='block')
      showK(lastK.code, lastK.name, null, lastK.atDate);
  }, 30*60*1000);
}
</script>
</body>
</html>
