<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山顶洞人复盘</title>
<style>
  :root{
    --bg:#0a0e16; --card:#121826; --card2:#0e1420; --line:#1f2937;
    --text:#e3e9f2; --dim:#78849a; --dim2:#556072;
    --up:#f5455c; --down:#2ebd85; --gold:#f0b90b; --blue:#3d8bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 40px}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;flex-direction:column;gap:2px;padding:3px 12px 4px;
         border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,22,.98);z-index:70}
  header .hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  header .htop{flex-wrap:wrap;row-gap:2px}
  /* 品牌标题：独占首行、置顶、放大高亮（所有页面共用同一个 header） */
  .brand{display:flex;align-items:center;justify-content:center;padding:1px 0 3px;
         border-bottom:1px solid rgba(240,185,11,.2)}
  header h1{font-size:21px;letter-spacing:3.5px;font-weight:900;white-space:nowrap;
            background:linear-gradient(90deg,#ffe08a,#ff9d5c 50%,#ffe08a);
            -webkit-background-clip:text;background-clip:text;color:transparent;
            filter:drop-shadow(0 0 8px rgba(240,185,11,.5))}
  header .upd{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
  header .alert{background:#c62828;color:#fff;border-radius:10px;padding:1px 9px;
                font-size:11px;white-space:nowrap;max-width:52vw;overflow:hidden;
                text-overflow:ellipsis;display:none}
  #refresh-btn,#reset-zoom{background:var(--card2);border:1px solid var(--line);color:var(--text);
          border-radius:12px;padding:2px 9px;font-size:11px;cursor:pointer;white-space:nowrap;line-height:1.5}
  #refresh-btn:hover,#reset-zoom:hover{border-color:var(--blue)}
  #refresh-btn:disabled{opacity:.5;cursor:wait}
  /* 历史定位：年 / 月 / 日 下拉 + 今日按钮（标题栏第二行，固定不占页面宽度） */
  .hsel{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .hsel .lb{color:var(--dim);font-size:11px;white-space:nowrap}
  .hsel select{background:var(--card2);border:1px solid var(--line);color:var(--text);
               border-radius:7px;padding:1px 5px;font-size:11px;outline:none;cursor:pointer}
  .hsel .dinfo{color:var(--dim2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 四个导航：并入 header 首行、顶端固定；各自不同底色，紧凑胶囊 */
  nav{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
  nav button{border:1px solid;color:var(--text);padding:3px 9px;border-radius:6px;
             cursor:pointer;font-size:11.5px;font-weight:700;white-space:nowrap;
             line-height:1.35;transition:filter .15s,box-shadow .15s}
  nav button:hover{filter:brightness(1.25)}
  nav button[data-t="market"]{background:rgba(61,139,255,.16);border-color:rgba(61,139,255,.45);color:#a8ccff}
  nav button[data-t="theme"] {background:rgba(165,94,234,.16);border-color:rgba(165,94,234,.45);color:#dcbafb}
  nav button[data-t="ladder"]{background:rgba(46,189,133,.14);border-color:rgba(46,189,133,.42);color:#96e3c6}
  nav button.on[data-t="market"]{background:#1b4a90;color:#fff;border-color:#78b0ff;box-shadow:0 0 9px rgba(61,139,255,.55)}
  nav button.on[data-t="theme"] {background:#5a2c8c;color:#fff;border-color:#c693ff;box-shadow:0 0 9px rgba(165,94,234,.55)}
  nav button.on[data-t="ladder"]{background:#136a49;color:#fff;border-color:#2ebd85;box-shadow:0 0 9px rgba(46,189,133,.5)}
  nav button[data-t="chance"]{background:rgba(224,64,151,.15);border-color:rgba(224,64,151,.45);color:#f7b2dd}
  nav button.on[data-t="chance"]{background:#8c1f61;color:#fff;border-color:#ff9ed7;box-shadow:0 0 9px rgba(224,64,151,.5)}
  nav button[data-t="decision"]{background:rgba(38,198,218,.14);border-color:rgba(38,198,218,.42);color:#9fe8f2}
  nav button.on[data-t="decision"]{background:#0e6a78;color:#fff;border-color:#5fe0ef;box-shadow:0 0 9px rgba(38,198,218,.5)}
  .page{display:none;padding:12px 16px}
  .page.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h3{font-size:14px;margin-bottom:10px}
  .sub{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  /* ---------- 空间情绪图 ---------- */
  /* 主图（标题+图表）sticky 固定在页面顶端：往下拉只滚动明细表，主图位置不变 */
  .mkt-sticky{position:sticky;top:calc(var(--hdr,58px) + var(--navh,0px));z-index:40;
              background:var(--bg);padding-bottom:6px}
  #chart-market{width:100%;height:min(36vh,380px);min-height:250px}
  /* 明细表与顶端标题栏同宽：卡片左右不留白，主图/信息条各自补内边距 */
  #page-market .card{padding:10px 0 12px}
  #page-market .mkt-sticky{padding:0 16px 6px}
  #page-market .mkt-info{padding:0 16px}
  #page-market #mkt-table{max-height:none}
  /* 题材炒作页：默认一屏显示（内容区内部滚动），浏览器可手动缩放 */
  #page-theme.on{display:flex;flex-direction:column;
    height:calc(100vh - var(--hdr,58px) - var(--navh,0px) - 28px)}
  #page-theme .card{display:flex;flex-direction:column;
    flex:1 1 auto;min-height:0;margin-bottom:0}
  #page-theme #theme-list{flex:1 1 auto;min-height:0;max-height:none}
  /* 赚钱效应题材卡金色高亮（v38） */
  .tcard.earn{box-shadow:inset 0 0 0 2px #f0b90b, 0 0 8px rgba(240,185,11,.35)}
  /* 赚钱效应：题材炒作图形式（日期降序行 + 板块卡片） */
  .mrow{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #151c29;align-items:flex-start}
  .mrow:hover{background:rgba(61,139,255,.05)}
  .mdate{flex:0 0 58px;color:var(--dim);font-size:11px;text-align:center;line-height:1.4;padding-top:3px}
  .mgroups{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto}
  .mcard{border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:var(--card2);
         font-size:10px;line-height:1.45;min-width:148px;max-width:250px}
  .mcard .r1{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .mcard .nm{font-weight:800;font-size:11px}
  /* 题材后紧跟「当日题材炒作页阶段」（启动/加强/转弱/反复），与题材卡同一口径 */
  .mcard .mstage{flex:0 0 auto;border-radius:3px;padding:0 4px;font-size:9px;font-weight:700;
                 background:rgba(0,0,0,.30);white-space:nowrap;line-height:1.5}
  .mcard .ct{font-size:9.5px;color:var(--dim)}
  .mcard .lad{color:var(--blue);font-variant-numeric:tabular-nums;font-weight:700;
              cursor:pointer;white-space:nowrap;
              text-decoration:underline dotted rgba(120,170,255,.55);text-underline-offset:2px}
  .mcard .lad:hover{color:#fff}
  .mcard .lb2{color:var(--dim2);font-size:9.5px;margin-right:3px}
  .mcard .r2{margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 空间情绪明细表：宽度锁定为顶端标题栏内宽，四列固定比例，绝不横向撑破 */
  .mtable{width:100%;border-collapse:collapse;font-size:10px;
          table-layout:fixed;border:1px solid var(--line)}
  .mtable col.c1{width:10%}
  .mtable col.c2{width:11%}
  .mtable col.c3{width:17%}
  .mtable col.c4{width:62%}
  .mtable th{color:var(--dim);font-weight:600;text-align:left;padding:2px 3px;
             border:1px solid var(--line);background:var(--card2);white-space:nowrap}
  .mtable td{padding:1px 3px;border:1px solid rgba(120,140,170,.22);white-space:normal;
             word-break:break-word;overflow-wrap:anywhere;line-height:1.45}
  .mtable td.num,.mtable td.stk-cell{white-space:nowrap}
  .mtable .num{font-variant-numeric:tabular-nums}
  .mkt-info{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mkt-info .lb{color:var(--dim);font-size:12px;margin-right:4px}
  .schip{background:var(--card2);border:1px solid rgba(245,69,92,.5);border-radius:6px;
         padding:3px 9px;font-size:12.5px}
  .schip small{color:var(--dim);margin-left:4px}
  .schip .th{color:var(--blue);font-size:11px;margin-left:4px}
  #sup-pop{position:fixed;z-index:99;background:#141c2e;border:1px solid var(--gold);
           border-radius:8px;padding:10px 14px;max-width:min(430px,calc(100vw - 16px));display:none;
           box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:12.5px;
           max-height:80vh;overflow-y:auto}
  #sup-pop h4{color:var(--gold);font-size:13px;margin-bottom:6px}
  #sup-pop .row{padding:2px 0}
  #sup-pop .th{color:var(--blue);font-size:11px;margin-left:5px}
  #sup-pop .rs{color:var(--dim);font-size:11px;margin-left:5px}
  #sup-pop .skhd{margin:6px 0 2px;font-size:11.5px;color:var(--text)}
  #sup-pop .skhd .bd{color:var(--gold);font-weight:bold}
  #sup-pop .skhd .st{color:var(--dim)}
  #sup-pop .skbox{width:100%;height:190px;border:1px solid var(--line);border-radius:6px;
                  background:var(--card2)}
  /* 明细表压制列：可点击 */
  .mtable td.sup-cell{cursor:pointer}
  .mtable td.sup-cell:hover{background:rgba(240,185,11,.10)}
  /* 题材连续炒作线路图弹窗（点击题材卡 → 该题材连续炒作日块）
     放宽宽度/高度比例，把「炒了多少次」独立成统计区完整展示，不再挤在标题里 */
  /* v55 新旧龙头交接叠加图浮层 */
  #hdpop{position:fixed;z-index:128;background:#10182a;border:1px solid #b07cf0;
         border-radius:10px;width:min(980px,95vw);height:min(700px,88vh);display:none;
         box-shadow:0 12px 40px rgba(0,0,0,.7);flex-direction:column}
  #hdpop .hdt{flex:none;padding:8px 36px 0 14px;font-size:13.5px;
              font-weight:700;color:#dcc0ff;cursor:move;user-select:none}
  #hdpop .hdt small{color:var(--dim);font-weight:400;margin-left:6px}
  #hdpop .hdx{position:absolute;top:4px;right:8px;z-index:5;color:var(--dim);font-size:18px;cursor:pointer;padding:4px}
  #hdpop .hdnav{flex:none;display:flex;align-items:center;gap:8px;padding:4px 14px}
  #hdpop .hdnav button{background:#241b38;border:1px solid #6a4a92;color:#dcc0ff;
                border-radius:6px;padding:2px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  #hdpop .hdnav button:hover{background:#3a2a56}
  #hdpop .hdnav span{color:var(--dim2);font-size:11.5px;min-width:120px;text-align:center}
  #hdpop .hdscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px;
                   border-top:1px solid #241b38}
  #hdpop .hdc{position:relative;width:100%}
  #hdpop .hdhead{position:absolute;left:66px;z-index:4;height:17px;display:flex;align-items:center;
                 gap:6px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  #hdpop .hdhead:hover{text-decoration:underline}
  #hdpop .hdhead .bd{color:#ffd24a;font-weight:700}
  #hdpop .hdhead .brk{color:var(--dim2);font-weight:400;font-size:9.5px}
  #hdpop .hdlegend{flex:none;position:static;padding:3px 14px 0;font-size:10.5px;
                   line-height:1.5;color:var(--dim)}
  #hdpop .hdlegend .hd-grp b{color:var(--text)}
  #hdpop .hdlegend a{color:var(--text);cursor:pointer}
  #hdpop .hdlegend a:hover{color:#dcc0ff}
  #hdpop .hdnote{flex:none;position:static;padding:2px 14px 8px;color:var(--dim2);font-size:10px}
  /* v58：交接弹窗 年/月/日 三段跳转 */
  #hdpop .hd-ymd{display:flex;gap:4px;align-items:center}
  #hdpop .hd-ymd select{background:#241b38;border:1px solid #6a4a92;color:#dcc0ff;
    border-radius:6px;padding:2px 4px;font-size:11px;cursor:pointer;max-width:74px}
  #hdpop .hd-ymd button{background:#3a2a56;border:1px solid #8a5ab2;color:#e6ccff;border-radius:6px;
    padding:2px 8px;font-size:11px;cursor:pointer}
  #hdpop .hd-ymd button:hover{filter:brightness(1.3)}
  .hd-open{float:right;background:#241b38;border:1px solid #6a4a92;color:#dcc0ff;
           border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;cursor:pointer;margin-left:8px}
  .hd-open:hover{background:#3a2a56}
  #thpop{position:fixed;z-index:95;background:#141c2e;border:1px solid var(--blue);
         border-radius:8px;padding:10px 14px;width:min(900px,calc(100vw - 16px));display:none;
         box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:12px;cursor:move;
         max-height:86vh;overflow-y:auto}
  #thpop h4{color:var(--blue);font-size:13.5px;margin-bottom:6px;padding-right:24px;line-height:1.5}
  /* 炒作次数统计：全期次数 / 本次展示 / 首炒·最近 / 四阶段分布，网格自适应不裁切 */
  #thpop .tstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
                gap:3px 12px;margin:2px 0 9px;padding:7px 10px;background:#101a2c;
                border:1px solid #26354f;border-radius:6px;font-size:11px;color:var(--dim)}
  #thpop .tstat b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
  #thpop .tstat .big{color:var(--blue);font-size:17px;font-weight:800;margin:0 2px}
  #thpop .tstat .row2{grid-column:1/-1;border-top:1px solid #22304a;padding-top:5px;margin-top:2px;
                      white-space:normal;line-height:1.7}
  #thpop .tstat .sw{display:inline-block;margin-right:10px;white-space:nowrap}
  #thpop .tstat .sw i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
  #thpop .tstat .note{grid-column:1/-1;color:var(--dim2);font-size:10px}
  /* v70 线路图改「连板梯队」横向列：每日一列，列内按板位分行，可左右拖动 */
  #thpop .thscroll{display:flex;gap:8px;overflow-x:auto;cursor:grab;padding:2px 0 8px}
  #thpop .thscroll.dragging{cursor:grabbing;user-select:none}
  #thpop .thcol{flex:0 0 176px;background:#101a2c;border:1px solid #26354f;border-radius:7px;
                padding:6px 8px;align-self:flex-start}
  #thpop .thcol.newest{border-color:#3d8bff;box-shadow:0 0 0 1px rgba(61,139,255,.35) inset}
  #thpop .thcol-hd{display:flex;justify-content:space-between;align-items:center;gap:6px;
                   font-size:11px;color:#cfe0ff;font-weight:800;border-bottom:1px dashed #26354f;
                   padding-bottom:4px;margin-bottom:5px}
  #thpop .thcol-hd .stg4{font-size:9.5px;font-weight:700}
  #thpop .thlv{display:flex;gap:5px;align-items:flex-start;margin:3px 0}
  #thpop .thlv .lbd{flex:0 0 28px;font-size:10px;color:var(--gold);font-weight:800;text-align:right;
                    white-space:nowrap;padding-top:1px}
  #thpop .thlv .stks{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:3px;min-width:0}
  #thpop .thstk{font-size:10.5px;background:#1b2740;border:1px solid #33456a;border-radius:4px;
                padding:0 4px;cursor:pointer;white-space:nowrap;color:#e6eefc}
  #thpop .thstk:hover{border-color:#78b0ff;background:#24365c}
  #thpop .thstk em{font-style:normal;font-size:8.5px;color:#ffd24a;margin-left:2px}
  #thpop .thstk .tt{font-size:8.5px;color:#8b9bb5;margin-left:3px}
  #thpop .drow{display:flex;align-items:center;gap:8px;padding:3px 0;
               border-bottom:1px solid rgba(120,140,170,.15);cursor:auto}
  #thpop .drow:last-child{border-bottom:none}
  #thpop .dt{color:var(--dim);font-size:11px;min-width:42px;white-space:nowrap}
  #thpop .ct{font-weight:700;white-space:nowrap}
  #thpop .lad{color:var(--blue);font-size:11px;white-space:nowrap}
  #thpop .ld{cursor:pointer;padding:1px 4px;border-radius:4px;min-width:0;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  #thpop .ld:hover{background:rgba(61,139,255,.15)}
  #thpop .ld b{color:#fff}
  #thpop .ld em{font-style:normal;color:var(--up);font-size:10.5px;margin-left:2px}
  /* 题材卡「点梯队」浮层：当日板块梯队（各板数横条 + 完整涨停个股，可点日K） */
  #ladpop{position:fixed;z-index:97;background:#141c2e;border:1px solid var(--gold);
          border-radius:8px;padding:10px 14px;width:min(500px,calc(100vw - 16px));display:none;
          box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;
          max-height:82vh;overflow-y:auto}
  #ladpop h4{color:var(--gold);font-size:13px;margin-bottom:8px;padding-right:22px}
  #ladpop .lrow{display:flex;align-items:flex-start;gap:8px;margin:6px 0}
  #ladpop .lbd{flex:0 0 40px;font-weight:800;font-size:11.5px;color:var(--gold);
               text-align:right;padding-top:1px;white-space:nowrap}
  #ladpop .lbd em.role{display:block;font-style:normal;font-size:9px;font-weight:700;
               color:var(--dim2);line-height:1.4}
  #ladpop .lbd em.role.lead{color:#f0b90b}
  #ladpop .lbar{flex:0 0 66px;height:15px;background:#1b2438;border-radius:3px;
                overflow:hidden;position:relative;margin-top:1px}
  #ladpop .lbar i{position:absolute;left:0;top:0;bottom:0;
                  background:linear-gradient(90deg,#8a6a10,#f0b90b);border-radius:3px}
  #ladpop .lstk{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:3px;min-width:0}
  #ladpop .s{display:inline-block;background:#1c2740;border:1px solid #2b3a56;border-radius:4px;
             padding:1px 5px;font-size:11px;cursor:pointer;white-space:nowrap}
  #ladpop .s:hover{border-color:var(--blue);color:#fff}
  #ladpop .s b{color:var(--text);font-weight:600}
  #ladpop .s.lead{border-color:var(--up);background:rgba(245,69,92,.14)}
  /* v43 涨停形态标签：一字 / 赚T / 地天 / 普通 / 长腿 / 赚钱 / 低开 */
  #ladpop .s em.sp{font-style:normal;font-size:9px;margin-left:3px;border-radius:2px;
        padding:0 3px;font-weight:700;white-space:nowrap}
  .sp.sp-yz{background:rgba(245,69,92,.24);color:#ff9aa8}
  .sp.sp-zt{background:rgba(240,185,11,.22);color:#f6db86}
  .sp.sp-dt{background:rgba(165,94,234,.24);color:#d9b8ff}
  .sp.sp-pt{background:rgba(61,139,255,.2);color:#9fc6ff}
  .sp.sp-lt{background:rgba(46,189,133,.22);color:#8ce3bf}
  .sp.sp-zq{background:rgba(255,122,69,.22);color:#ffbd9e}
  .sp.sp-dk{background:#26303f;color:#9aa6b8}
  /* 涨停时间（首次封板）：早盘偏金、尾盘偏灰，一眼看出封板质量 */
  #ladpop .s em.st{font-style:normal;font-size:9px;margin-left:3px;
        font-variant-numeric:tabular-nums;color:var(--gold)}
  #ladpop .s em.st.late{color:var(--dim2)}
  .lbstk .stime{font-size:9px;color:var(--gold);font-variant-numeric:tabular-nums;
        flex:0 0 auto;margin-left:2px}
  .lbstk .stime.late{color:var(--dim2)}
  #ladpop .lfoot{margin-top:9px;color:var(--dim);font-size:11px;
                 border-top:1px solid #22304a;padding-top:6px;line-height:1.7}
  #ladpop .lfoot b{color:var(--text)}
  /* v68：题材当日梯队最下一行——高位断板跟踪 */
  #ladpop .brkrow{border-top:1px dashed #6e3742;margin-top:8px;padding-top:7px}
  #ladpop .s.brk{background:rgba(46,189,133,.10);border-color:#3c6a58}
  #ladpop .s.brk:hover{border-color:var(--down)}

  /* ---------- 每模块独立日期选择（年月日 + 确定） ---------- */

  /* 复盘：参与模拟控件 / 累积盈利列 / 炸板标记 */

  /* ---------- 题材炒作图（每日行内紧凑卡片，一屏尽量看完） ---------- */

  /* v51：题材炒作次数统计——改横滚隐藏滚动条为「自动换行网格 + 可见滚动条 + 限高容器」，

  /* ---------- 交易复盘（战法回测） ---------- */

  /* ---------- 赚钱效应 ---------- */
  .day-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}

                    padding:5px 12px;border-radius:14px;cursor:pointer;font-size:12px;white-space:nowrap}
  .day-chips button.on{border-color:var(--gold);color:var(--gold)}
  .grp{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card2)}
  /* 有延续性（梯队连续，含中位股）的题材：加粗高亮 */
  .grp.strong{border-color:rgba(240,185,11,.55);box-shadow:inset 3px 0 0 var(--gold)}

                border-radius:5px;padding:1px 8px;font-size:12px;color:var(--text)}
  .grp .mb{font-style:normal;color:var(--gold);font-size:11px;font-weight:700;margin-left:2px}
  .c-up{color:var(--up)} .c-down{color:var(--down)} .c-gold{color:var(--gold)} .c-blue{color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:6px;
        padding:4px 10px;font-size:12.5px;cursor:pointer;position:relative}

  .chip.re{border-color:rgba(245,69,92,.55)}
  .chip.rr{border-color:rgba(240,185,11,.55)}

  /* 日K弹窗（可拖动） */
  /* 日K弹窗：宽度留边、高度不超过视口（v68：此前 760px/90vh 在小屏会超出画面看不全） */
  #kpop{position:fixed;z-index:120;width:min(1040px,94vw);height:min(660px,78vh);
        max-height:calc(100vh - 20px);background:#10182a;border:1px solid var(--blue);border-radius:10px;display:none;
        box-shadow:0 12px 40px rgba(0,0,0,.65)}
  #kpop .kt{position:absolute;top:7px;left:12px;right:30px;z-index:2;font-size:13px;
            cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
  #kpop .kt small{color:var(--dim)}
  #kpop .kt .ovnote{color:#b07cf0;font-size:10px;margin-left:7px;white-space:nowrap}
  /* 「叠加前龙」按钮：放左下角（图表区左下、梯队条上方），避免遮挡右上角K线 */
  #kpop .kov{position:absolute;left:10px;bottom:70px;top:auto;right:auto;z-index:4;display:none;
             border:1px solid #b07cf0;background:rgba(24,18,38,.92);color:#dcc0ff;
             border-radius:5px;padding:3px 9px;font-size:10.5px;font-weight:700;
             cursor:pointer;white-space:nowrap;line-height:1.5}
  #kpop .kov:hover{background:rgba(176,124,240,.30)}
  #kpop .kov.on{background:#b07cf0;color:#15121c;border-color:#d9b8ff}
  #kpop .kx{position:absolute;top:2px;right:6px;z-index:3;color:var(--dim);
            font-size:17px;cursor:pointer;line-height:1;padding:6px}
  #kpop .kx:hover{color:var(--text)}
  #kpop .kc{position:absolute;left:0;right:0;top:0;bottom:66px}
  /* v51：分时走势浮层——点日K任一蜡烛弹出该日分时；只显示时间/价/涨幅，不显示开收价浮窗 */
  #mppop{position:fixed;z-index:130;width:min(920px,94vw);height:min(460px,70vh);
         background:#10182a;border:1px solid var(--gold);border-radius:10px;display:none;
         box-shadow:0 12px 44px rgba(0,0,0,.7)}
  #mppop .mpt{position:absolute;top:6px;left:12px;right:30px;z-index:2;font-size:12.5px;
              cursor:move;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--gold)}
  #mppop .mpt small{color:var(--dim);margin-left:6px}
  #mppop .mpx{position:absolute;top:2px;right:6px;z-index:3;color:var(--dim);
              font-size:17px;cursor:pointer;line-height:1;padding:6px}

  /* 当日题材梯队：弹窗底部条，点梯队个股直接切换日K */
  #kpop .klad{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:5;

  .lbday{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;margin-bottom:4px;

<script>
/* 带超时的全局 fetch（分时兜底 / 新浪日K兜底等直连用；刷新闭包内有同名局部版） */
async function fetchT(url, ms){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = setTimeout(()=>{ try{ if(ctl) ctl.abort(); }catch(e){} }, ms||7000);
  try{ return await fetch(url, {cache:'no-store', signal: ctl? ctl.signal : undefined}); }
  finally{ clearTimeout(tm); }
}
const C = {up:'#f5455c', down:'#2ebd85', gold:'#f0b90b', blue:'#3d8bff',
           dim:'#78849a', dim2:'#556072', line:'#1f2937', text:'#e3e9f2'};
/* 阶段：实色用于顶部色条+图例，半透明用于背景带 */
const STAGE_SOLID = {'节点':'#9fe3e0','补涨':'#ffd24a','突破':'#f5455c','主升':'#a55eea'};
const STAGE_BG = {'节点':'rgba(159,227,224,.85)','补涨':'rgba(255,210,74,.75)',
                  '突破':'rgba(248,80,100,.58)','主升':'rgba(176,106,244,.62)',
                  null:'rgba(40,50,66,.35)'};
/* 阶段色块上的文字色（浅底用深字） */

function fmtDate(d){ return d.slice(4,6)+'-'+d.slice(6,8); }
/* v45：全站「口径」说明统一折叠展示（默认收起，点开才看规则细节） */
function kjNote(body, title){
  return '<details class="kj"><summary>'+(title||'口径说明')+' ▾</summary>'+
         '<div class="kjb">'+body+'</div></details>';
}
function chgSpan(v){
  if(v==null) return '<span class="c-gold">?</span>';

function renderHeader(){

/* ================= 空间情绪图 ================= */
let mktChart=null, kChart=null;   // kChart 显式声明：此前隐式全局，读取时抛 ReferenceError

function renderMarket(){
  const R = window.REVIEW;
  const days = R.stages;
  const labels = days.map(d=>fmtDate(d.date));
  const el = document.getElementById('chart-market');
  if(mktChart) mktChart.dispose();
  mktChart = echarts.init(el, null, {renderer:'canvas'});
  /* 浅色底图配色 */
  const LC = {bg:'#e9edf4', axis:'#c3cdda', text:'#52627a',
              up:'#e0243a', gold:'#b8860b',
              band:'rgba(21,101,192,.16)', strip:'#a8c6ee'};

  // 色柱：只显示"当天"（最新交易日）一根，柱内标注当天空间龙头
  const lastIdx = days.length-1;
  const sfTxt = (d)=>{
    const sf = d.spaceFull||[];
    if(!sf.length) return '';
    return sf.slice(0,3).map(s=>s.name+'·'+s.boards+'板').join('、') +
           (sf.length>3 ? ' 等'+sf.length+'只' : '');
  };
  const band = days.map((d,i)=> i!==lastIdx ? null :
    {value:1, itemStyle:{color:LC.band},
     label:{show:!!sfTxt(d), position:'insideTop', distance:4,
       formatter:sfTxt(d), color:'#14406e', fontSize:10.5, fontWeight:'bold',
       width:150, overflow:'break', lineHeight:14}});
  const strip = days.map((d,i)=> i!==lastIdx ? null :
    {value:1, itemStyle:{color:LC.strip}});

  // 空间压制数值：仅在数值变化处标一次，避免连续横线重复标注
  const supShow = days.map((d,i)=> d.suppress!=null && d.suppress!==(i>0?days[i-1].suppress:null));
  const supData = days.map(d=> d.suppress==null?null:d.suppress);

  // 断板菱形（标在断板日、该龙头的高度上）
  const broke = days.map((d,i)=> d.note && d.note.includes('断板') ?
      {coord:[i, Math.min(12, d.suppress!=null? d.suppress : d.spaceTop)], symbol:'diamond', symbolSize:10,
       itemStyle:{color:LC.gold}} : null).filter(Boolean);

  // 空间突破：在折线该日上方用「火焰」图标标注（SVG 内联，避免 emoji 字体缺失）
  const FIRE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="26" viewBox="0 0 22 26">'+

    xAxis:[

       axisLine:{lineStyle:{color:LC.axis}},axisTick:{show:false},

               fontWeight:'bold', textBorderColor:'#ffffff', textBorderWidth:2.5,
               formatter:p=> supShow[p.dataIndex] ? (p.value||'') : ''} }

  /* X 轴「逐日显示日期」：默认 interval:0 每个交易日都标注 MM-DD；
     缩放放大到容器物理宽度排不下时才按可见天数降采样（并加大旋转角），避免标签糊成一片 */
  function updateMarketXAxis(){
    if(!mktChart) return;

    const interval = vis>fit ? Math.ceil(vis/fit)-1 : 0;
    mktChart.setOption({xAxis:[{axisLabel:{

  // 当日空间龙头（含题材）常显

  // 梯队口径：只用「当日」ladders（当日涨停池 × 个股题材映射），绝不回看历史日，

  const LAD = R.ladders||{};
  if(!Object.keys(T_COLOR).length){ try{ buildThemeColors(); }catch(e){} }
  const ladOf = (dt, theme)=>{
    if(!theme) return null;

  };
  const themeInfo = (dt, theme)=>{
    if(!theme) return '<span style="color:'+C.dim2+'">—</span>';
    const e = ladOf(dt, theme);
    if(!e) return '<span style="color:'+C.dim2+'">—</span>';
    const col = T_COLOR[tName(theme)] || C.blue;
    const st = themeStage(tName(theme), dt);          // 当日阶段（同一天算，不再借历史日）
    // 家数 = 当日真实涨停池内该题材的涨停只数（准确值，不再有「约等于」估算）
    return '<b title="当日真实涨停只数（必须涨停才计入）">'+e.count+'</b>只'+
      (e.ladder? ' <span class="ld-lad" style="color:'+col+'">'+e.ladder+'</span>':'')+
      (st? ' '+stage4Chip(st) : '');
  };
  let th = '<table class="mtable">'+
    '<colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>'+
    '<thead><tr><th>日期</th><th>空间压制</th><th>空间龙头（连板）</th><th>题材·梯队·阶段</th></tr></thead><tbody>';
  // 个股一色：同一只股全表固定一种颜色（名字哈希取色）
  const STK_COL = ['#1565c0','#c62828','#2e7d32','#6a1b9a','#e65100','#00838f',
    '#ad1457','#33691e','#d84315','#4527a0','#8d6e00','#00695c','#283593',
    '#b71c1c','#ef6c00','#558b2f'];
  const stkColor = n=>{ let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0;
                       return STK_COL[h%STK_COL.length]; };
  for(let i=days.length-1;i>=0;i--){
    const d = days[i];
    const sf = d.spaceFull||[];
    const rows = sf.length ? sf : [null];
    const n = rows.length;
    const broke = d.suppress!=null && d.spaceTop>d.suppress;   // 空间高度突破前期压制
    rows.forEach((s,j)=>{
      th += '<tr data-dt="'+d.date+'">';
      const hotDay = d.stage==='突破' || d.stage==='主升';
      if(j===0){    // 同一天的个股合并日期列与压制高度列（点击查看压制龙头+炒作概念）
        const stg = d.stage;
        const hot = hotDay;
        const stgHtml = stg?

          (stg==='突破'?'🔥':'')+stg+'</div>' : '';
        // 空间压制列：突破/主升阶段显示当日空间高度；其余显示压制高度
        let supHtml;
        if(hot){
          supHtml = '<span style="color:'+(stg==='突破'?C.up:'#b07cf0')+';font-weight:bold">'+
                    stg+' '+(d.spaceTop||0)+'板</span>';
        } else if(d.suppress!=null){
          supHtml = '<span class="c-gold">'+d.suppress+'板 ▾</span>';
        } else if(broke){
          supHtml = '<span style="color:'+C.up+';font-weight:bold">突破 '+(d.spaceTop||0)+'板</span>';
        } else {
          supHtml = '<span style="color:'+C.dim2+'">—</span>';
        }
        th += '<td class="num dt-cell" data-dt="'+d.date+'" title="点击 → 空间情绪图定位到该日" '+
          'rowspan="'+n+'">'+fmtDate(d.date)+stgHtml+'</td>'+
          '<td class="num sup-cell" data-di="'+i+'" rowspan="'+n+'"'+
          (d.suppress!=null? ' title="点击查看形成空间压制的断板空间龙头"':'')+'>'+supHtml+'</td>';

      if(!s){

      const hotBg = hotDay ? (d.stage==='突破'

          : 'background:rgba(165,94,234,.24);color:#dcc0ff;') : ('color:'+tcol+';');
      // 一行显示全部信息：龙头+连板 | 题材·梯队·阶段
      th += '<td class="stk-cell" data-code="'+s.code+'" data-name="'+s.name+'" data-date="'+d.date+'" '+

        (s.s? '<em class="sp '+shapeCls(s.s)+'" title="'+SP_TIP+'">'+s.s+'</em>':'')+'</td>'+

        (s.theme? ' title="点击 → 题材炒作页「'+s.theme+'」'+fmtDate(d.date)+'（闪动提示）"':'')+'>'+
        (s.theme? '<b style="color:'+tcol+'">'+s.theme+'</b> ':'<span style="color:'+C.dim2+'">—</span>')+
        themeInfo(d.date, s.theme)+'</td></tr>';
    });

  th += '</tbody></table>';
  document.getElementById('mkt-table').innerHTML = th;
  // 表格填充会改变容器高度 → 重算画布，否则 Y 轴下半段被裁、低板数日看不到
  requestAnimationFrame(()=>{ if(mktChart) mktChart.resize(); });
  setTimeout(()=>{ if(mktChart) mktChart.resize(); }, 120);
  // 压制列点击 → 弹出形成压制的断板空间龙头及炒作概念
  document.querySelectorAll('#mkt-table .sup-cell').forEach(td=>{
    td.onclick = (ev)=>{
      const d = days[+td.dataset.di];
      if(d && d.suppress!=null) showSupPop(d, ev);

  // 空间龙头点击 → 该股日K（箭头指当日）
  document.querySelectorAll('#mkt-table .stk-cell').forEach(td=>{

  });
  // 日期点击 → 空间情绪图联动跳转（缩放窗口对准该日 + 金色竖线 + 高亮该行）

      ev.stopPropagation();

    if(!Array.isArray(v)) return;
    const i = Math.round(v[0]);

/* 空间情绪图定位到指定日期：窗口居中 + 金色竖线 + 当日 tooltip */
function focusChartDate(date){
  const days = window.REVIEW.stages;
  if(!mktChart) return;
  const idx = days.findIndex(x=>x.date===date);
  if(idx < 0) return;
  const dz = (mktChart.getOption().dataZoom||[])[0] || {start:0,end:100};
  let cnt = Math.max(5, Math.round((dz.end-dz.start)/100*days.length));
  cnt = Math.min(cnt, days.length);
  let s = 100*(idx - cnt/2)/days.length, e = s + 100*cnt/days.length;
  if(s < 0){ s = 0; e = 100*cnt/days.length; }
  if(e > 100){ e = 100; s = 100 - 100*cnt/days.length; }
  mktChart.dispatchAction({type:'dataZoom', start:Math.max(0,s), end:Math.min(100,e)});
  mktChart.setOption({series:[{},{},{markLine:{
    symbol:'none', silent:true, animation:false,
    label:{show:false},
    lineStyle:{color:'#b8860b', width:1.4, type:'dashed', opacity:.85},
    data:[{xAxis:fmtDate(date)}]}}]});
  setTimeout(()=>{
    const d = days[idx], info = document.getElementById('hsel-info');
    if(info && d) info.textContent = fmtDate(d.date)+' 空间高度'+(d.spaceTop||0)+'板 '+
      d.ztCount+'家涨停'+(d.suppress!=null? ' · 空间压制'+d.suppress+'板':'')+
      (d.stage? ' · '+d.stage:'');
  }, 60);
}
/* 轻提示（跳转后题材不可见时说明原因） */
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:200;'+
      'background:#1c2740;border:1px solid #3d8bff;color:#e3e9f2;border-radius:8px;'+
      'padding:6px 14px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.5);'+
      'max-width:86vw;text-align:center;transition:opacity .25s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '0'; }, 2600);
}
/* 跳转题材炒作页：定位到「日期行 + 该题材卡」并闪动 */
function gotoTheme(date, theme){
  if(!date || !theme) return;
  const all = (window.REVIEW.dates||[]).slice().sort();
  const back = all.length - all.indexOf(date);
  if(back > THEME_RANGE) THEME_RANGE = back <= 90 ? 90 : 9999;   // 该日不在当前范围 → 自动放宽
  THEME_FOCUS = null;
  switchTab('theme');
  renderTheme();
  setTimeout(()=>{
    const row = document.querySelector('#theme-list .trow[data-d="'+date+'"]');
    if(!row){ toast('题材页未收录 '+fmtDate(date)); return; }
    row.scrollIntoView({block:'center'});
    let card = null;
    row.querySelectorAll('.tcard').forEach(c=>{ if(c.dataset.th === tName(theme)) card = c; });
    if(card){
      card.classList.add('flash');
      setTimeout(()=>card.classList.remove('flash'), 2400);
      card.scrollIntoView({block:'nearest', inline:'center'});
    } else {
      row.classList.add('flash');
      setTimeout(()=>row.classList.remove('flash'), 2400);
      toast('「'+tName(theme)+'」'+fmtDate(date)+' 未达题材入链门槛（需板块有连板且涨停≥3只），当日梯队见空间情绪明细表');
    }
  }, 70);
}
/* 明细表跳转到指定日期行并短暂高亮（滚动位置避开 sticky 主图遮挡） */
function jumpTableTo(date){  const row = document.querySelector('#mkt-table tr[data-dt="'+date+'"]');
  if(!row) return;
  const st = document.getElementById('mkt-sticky');
  const targetTop = (st? st.getBoundingClientRect().bottom : 110) + 12;   // sticky 主图底边 + 间距
  const y = row.getBoundingClientRect().top + window.scrollY - targetTop;
  window.scrollTo({top: Math.max(0, y), behavior:'auto'});
  row.querySelectorAll('td').forEach(td=>td.classList.add('hl-day'));
  setTimeout(()=>document.querySelectorAll('#mkt-table td.hl-day')
    .forEach(td=>td.classList.remove('hl-day')), 1600);
}
/* 某日「当日涨跌幅」= 该日收盘 / 前一交易日收盘 - 1（bars 为 [日期,开,收,低,高]） */
function supChg(bars, date){
  if(!bars || bars.length < 2) return null;
  let i = -1;
  for(let k=0;k<bars.length;k++){ if(bars[k][0] <= date) i = k; else break; }
  if(i < 1 || !bars[i-1][2]) return null;
  return {pct:(bars[i][2]/bars[i-1][2]-1)*100, date:bars[i][0]};
}
function chgTag(v){
  if(!v) return '';
  return '<b style="margin-left:4px;color:'+(v.pct>=0?C.up:C.down)+'">'+
         (v.pct>=0?'+':'')+v.pct.toFixed(2)+'%</b>';
}
function showSupPop(d, e, withK){
  if(withK===undefined) withK = true;
  const pop = document.getElementById('sup-pop');
  const ss = d.suppressStocks||[];
  const SK = window.REVIEW.supKlines||{};
  pop.innerHTML = '<span class="popx">✕</span><h4>'+fmtDate(d.date)+' 空间压制 '+d.suppress+'板（由以下断板空间龙头形成）</h4>'+
    (ss.length? ss.map((s,i)=>{
      const bars = SK[s.code+'_'+s.breakDate]||[];
      const cBreak = supChg(bars, s.breakDate);      // 断板当日涨跌幅
      const cDay = supChg(bars, d.date);             // 点击当日涨跌幅
      const cLast = supChg(bars, '99999999');       // 窗口末端（最新交易日）当日涨跌幅
      const showDay = cDay && cDay.date === d.date && d.date !== s.breakDate;
      const showLast = cLast && cLast.date !== s.breakDate &&
                       (!showDay || cLast.date !== d.date);
      return '<div class="row"><b>'+s.name+'</b> '+s.boards+'板 · '+fmtDate(s.breakDate)+'断板'+
      (s.theme? '<span class="th">'+s.theme+'</span>':'')+
      (s.reason? '<span class="rs">'+s.reason+'</span>':'')+'</div>'+
      '<div class="row" style="font-size:11.5px;color:'+C.dim+'">断板当日'+
        (cBreak? chgTag(cBreak):' <span>—</span>')+
        (showDay? '　当日('+fmtDate(d.date)+')'+chgTag(cDay):'')+
        (showLast? '　最新('+fmtDate(cLast.date)+')'+chgTag(cLast):'')+'</div>'+
      (withK && bars.length? '<div class="skhd" id="skhd'+i+'"></div><div class="skbox" id="skbox'+i+'"></div>':'');
    }).join('')
     : '<div class="row" style="color:'+C.dim+'">无记录</div>');
  pop.querySelector('.popx').onclick = ()=>{ clearTimeout(pop._t); pop.style.display='none'; };
  pop.style.display = 'block';
  const [W, H] = landWH();
  if(e && e.currentTarget){          // 明细表内点击：弹窗定位于点击单元格下方
    const r = e.currentTarget.getBoundingClientRect();
    const [px, py] = landXY({clientX:r.left+r.width/2, clientY:r.bottom});
    pop.style.left = Math.max(8, Math.min(px-60, W-Math.min(pop.offsetWidth, W-16)-8))+'px';
    pop.style.top = Math.max(8, Math.min(py+6, H-pop.offsetHeight-8))+'px';
  } else {
    const rect = mktChart.getDom().getBoundingClientRect();
    const [px, py] = landXY({clientX: rect.left+20, clientY: rect.top+56});
    pop.style.left = Math.max(8, Math.min(px, W-Math.min(pop.offsetWidth, W-16)-8))+'px';
    pop.style.top = Math.max(8, Math.min(py, H-pop.offsetHeight-8))+'px';
  }
  // 绘制各压制股断板日附近日K（箭头指示断板日；空间图弹窗不画K）
  if(pop._charts) pop._charts.forEach(c=>c.dispose());
  pop._charts = [];
  if(withK) ss.forEach((s,i)=>{
    const bars = SK[s.code+'_'+s.breakDate]||[];
    const box = document.getElementById('skbox'+i);
    if(bars.length && box)
      pop._charts.push(drawSupK(box, bars, s.breakDate, s.name, document.getElementById('skhd'+i), s.code));
  });
  // 弹窗常驻（可拖动到任意位置查看），点 ✕ 或点空白处关闭
  clearTimeout(pop._t);
  if(pop._charts && pop._charts.length) setTimeout(()=>pop._charts.forEach(c=>c.resize()), 40);
}
// 压制龙头断板日附近日K：断板前8根~后30根，金色箭头指向断板日K线
function drawSupK(box, bars, breakDate, name, hd, code){
  const chart = echarts.init(box);
  const ds = bars.map(b=>b[0]);
  let bi = -1;                                // 断板日索引（缺失时取断板日前最近一根）
  bars.forEach((b,i)=>{ if(b[0]<=breakDate) bi=i; });
  const bd = bi>=0? bars[bi][0] : bars[0][0];
  if(hd){
    let st = '';
    if(bi>=0 && bi<bars.length-1){
      const base = bars[bi][2];
      let lo=1e9,loD='',hi=0,hiD='';
      bars.slice(bi+1).forEach(b=>{ if(b[3]<lo){lo=b[3];loD=b[0];} if(b[4]>hi){hi=b[4];hiD=b[0];} });
      const p = v=>((v/base-1)*100).toFixed(1);
      const cl = v=>'<span style="color:'+(p(v)>=0?C.up:C.down)+'">'+p(v)+'%</span>';
      st = '断板后'+(bars.length-1-bi)+'日：最低 '+cl(lo)+'（'+fmtDate(loD)+
           '）· 最高 '+cl(hi)+'（'+fmtDate(hiD)+'）· 最新 '+cl(bars[bars.length-1][2]);
    }
    hd.innerHTML = '<span class="bd">▼ '+fmtDate(bd)+' 断板</span> '+name+' 附近日K'+
      (st? '<div class="st">'+st+'</div>':'');
  }
  chart.setOption({
    grid:{left:4,right:40,top:10,bottom:16,containLabel:true},
    // 用户口径：日K浮窗不显示开收最高低价，只保留日期与涨跌幅；点蜡烛看当日分时
    tooltip:{trigger:'axis',enterable:true,confine:true,axisPointer:{type:'cross'},textStyle:{fontSize:11},
      formatter(ps){
        const i = ps[0].dataIndex, b = bars[i];
        const chg = i>0 && bars[i-1][2] ? (b[2]/bars[i-1][2]-1)*100 : null;
        return fmtDate(b[0])+
          (chg!=null? '<br/><span style="color:'+(chg>=0?C.up:C.down)+'">当日涨跌 '+
            (chg>=0?'+':'')+chg.toFixed(2)+'%</span>':'');
      }},
    xAxis:{type:'category',data:ds,axisLine:{lineStyle:{color:'#3a465c'}},axisTick:{show:false},
      axisLabel:{color:'#7e8ea6',fontSize:10,interval:Math.max(0,Math.floor(ds.length/4)-1),
                 formatter:v=>v.slice(4,6)+'/'+v.slice(6)}},
    yAxis:{scale:true,position:'right',axisLabel:{color:'#7e8ea6',fontSize:10},
      splitLine:{lineStyle:{color:'rgba(120,140,170,.15)'}}},
    series:[{type:'candlestick',data:bars.map(b=>[b[1],b[2],b[3],b[4]]),
      itemStyle:{color:C.up,color0:C.down,borderColor:C.up,borderColor0:C.down},
      markPoint:{symbol:'arrow',symbolRotate:180,symbolSize:13,symbolOffset:[0,-9],
        itemStyle:{color:C.gold},label:{show:false},
        data: bi>=0? [{coord:[bi,bars[bi][4]],name:'断板日'}] : []},
      markLine:{silent:true,symbol:'none',label:{show:false},
        lineStyle:{type:'dashed',color:C.gold,opacity:.5,width:1},
        data: bi>=0? [{xAxis:bi}] : []}
    }]
  });
  /* v54：点日K任一蜡烛 → 弹出该日分时（价格线/均价线/成交量，无开收浮窗），与全站同口径 */
  if(code){
    chart.on('click', p=>{
      if(p && p.seriesType==='candlestick' && p.dataIndex!=null){
        const dd=ds[p.dataIndex];
        if(dd) showMinute(code, name, dd, p.event && p.event.event);
      }
    });
  }
  tipDrag(chart);
  return chart;
}

/* ================= 题材炒作图（每日行内卡片） ================= */
/* 同一题材跨日同名不同写法 → 统一（与 fetch_data.py 的 THEME_ALIAS 一致） */
const THEME_ALIAS = {'短剧传媒':'短剧','机器人+物理AI':'机器人',
                     '“华”字辈':'华字辈','"华"字辈':'华字辈'};
const tName = n => THEME_ALIAS[n] || n;
/* 题材 → 固定色（同一题材永远同色） */
let T_COLOR = {}, THEME_FOCUS = null, THEME_RANGE = 30, LEGEND_ALL = false;
function themeColor(i){
  const h = (205 + i*137.508) % 360;                   // 黄金角分布，题材多时不挤在同一色区
  const l = i < 16 ? 63 : (i % 2 ? 55 : 69);
  const sat = i < 16 ? 70 : 55;
  return 'hsl('+h+','+sat+'%,'+l+'%)';
}
/* 题材炒作阶段（四分类，按字色区分）：
   启动=白字（最近5日首次出现，即前4个交易日无此题材）
   加强=红字（相邻交易日，板块涨停数较前一日增加）
   转弱=绿字（相邻交易日，板块涨停数较前一日减少）
   反复=黄字（断了1~3日后重新出现；相邻日数量持平） */
const STAGE4_COL = {'启动':'#f2f6ff','加强':'#f5455c','转弱':'#2ebd85','反复':'#f0b90b'};
let _TSTAGE = null;
/* 全站题材块已统一为「当日真实涨停池」口径（必须涨停才统计），
   所有块都参与阶段判定，不再区分文章块 / 池推估算块 */
const isArt = t => !!t;
function TStages(){
  if(_TSTAGE) return _TSTAGE;
  const R = window.REVIEW, TD = R.themeDetail;
  const all = R.themeDates.slice().sort();
  // 阶段间隔按「交易日」算（不是按有题材的日子算），否则中间的无题材交易会被漏计
  const DALL = (R.dates && R.dates.length ? R.dates : all).slice().sort();
  const idx = {}; DALL.forEach((d,i)=>idx[d]=i);
  const blk = (d,n)=> (TD[d]||[]).find(x=>tName(x.name)===n && isArt(x)) || null;
  const occ = {};                                  // name -> [出现日期]
  all.forEach(d=>(TD[d]||[]).forEach(t=>{
    if(!isArt(t)) return;
    const n = tName(t.name);
    const arr = occ[n] || (occ[n]=[]);
    if(arr[arr.length-1] !== d) arr.push(d);
  }));
  const res = {};
  Object.keys(occ).forEach(n=>{
    const ds = occ[n];                             // 已按时间升序
    const st = {};
    ds.forEach((d,k)=>{
      const c = (blk(d,n)||{}).count;
      if(k===0){ st[d]='启动'; return; }           // 全期首次出现
      const gap = idx[d] - idx[ds[k-1]];
      if(gap >= 5){ st[d]='启动'; return; }        // 最近5日首次出现
      if(gap >= 2){ st[d]='反复'; return; }        // 断了1~3日后重新出现
      // 连续出现（相邻交易日）：按涨停数增减区分加强/转弱
      const pc = (blk(ds[k-1],n)||{}).count;
      st[d] = c > pc ? '加强' : (c < pc ? '转弱' : '反复');
    });
    res[n] = st;
  });
  _TSTAGE = res;
  return res;
}
function themeStage(nm, date){
  const s = TStages()[tName(nm)];
  return (s && s[date]) || '';
}
function stage4Chip(st){
  if(!st) return '';
  return '<span class="stg4" style="color:'+STAGE4_COL[st]+'">'+st+'</span>';
}
function buildThemeColors(){
  const TD = window.REVIEW.themeDetail;
  const LAD = window.REVIEW.ladders || {};
  const stat = {};
  Object.keys(TD).forEach(d=>{
    TD[d].forEach(t=>{
      const n = tName(t.name);
      const s = stat[n] || (stat[n]={days:0, total:0});
      s.days += 1; s.total += t.count;
    });
  });
  // 只在梯队里出现（复盘未覆盖）的题材也要有稳定颜色，保证「同题材同色」跨页一致
  Object.keys(LAD).forEach(d=>{
    Object.keys(LAD[d]).forEach(nm=>{
      const n = tName(nm);
      if(!stat[n]) stat[n] = {days:1, total:LAD[d][nm].count||1};
    });
  });
  const order = Object.keys(stat).sort((a,b)=>
    (stat[b].days-stat[a].days) || (stat[b].total-stat[a].total));
  T_COLOR = {};
  order.forEach((n,i)=>{ T_COLOR[n] = themeColor(i); });
  return order.map(n=>n);
}
function renderTheme(){
  const R = window.REVIEW;
  const TD = R.themeDetail;
  // 日期轴用全部交易日：无达标题材的交易日也要显示一行提示，避免看起来像"缺数据"
  const all = (R.dates && R.dates.length ? R.dates : R.themeDates).slice().sort();
  const startIdx = Math.max(0, all.length - THEME_RANGE);
  const dts = all.slice(startIdx);
  const srcMap = R.themeSource||{};
  const order = buildThemeColors();          // 颜色按全年活跃度固定，不随筛选变化
  const get = (t,d)=> (TD[d]||[]).find(x=>tName(x.name)===t) || null;

  // 时间范围
  document.getElementById('theme-range').innerHTML =
    [[30,'近1月'],[90,'近3月'],[9999,'全年']].map(([n,tx])=>
      '<button data-n="'+n+'"'+(THEME_RANGE===n?' class="on"':'')+'>'+tx+'</button>').join('')+
    '<span class="co">'+dts.length+' 个交易日 · 共 '+R.themeDates.length+' 日有题材</span>';
  document.getElementById('theme-range').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ THEME_RANGE = +b.dataset.n; renderTheme(); };
  });
  paintDpStage('theme', MOD_DATE['theme'] || dts[dts.length-1] || '');   // v71：跟随模块已选日期

  /* v51：图例 = 「时间段内题材炒作次数统计」。旧版按全期 order 排、默认只列 top18、
     横滚且隐藏滚动条 → 用户看不到「哪个题材炒作多少次」。改为：按当前时间段内出现次数
     降序，全部题材一次铺开（限高容器 + 可见滚动条），每个都显示次数。 */
  const inRange = order.filter(n=> dts.some(d=>get(n,d)));
  const cntList = inRange.map(n=>({n:n, c:dts.filter(d=>get(n,d)).length}))
                         .sort((a,b)=> b.c-a.c || a.n.localeCompare(b.n));
  const totalOcc = cntList.reduce((s,x)=>s+x.c,0);
  document.getElementById('theme-legend').innerHTML =
    '<div class="lg-hd">当前时间段（'+dts.length+' 个交易日）题材炒作次数统计：'+
      '<b>'+cntList.length+'</b> 个题材 · 合计 <b>'+totalOcc+'</b> 次 · 按次数降序 · 点题材只看该题材</div>'+
    cntList.map(x=>{
      return '<button data-th="'+x.n+'" title="【'+x.n+'】在当前时间段内炒作 '+x.c+
        ' 次（点击只看该题材）"'+(THEME_FOCUS&&THEME_FOCUS!==x.n?' class="off"':'')+'>'+
        '<i style="background:'+T_COLOR[x.n]+'"></i>'+x.n+' <em>'+x.c+'次</em></button>';
    }).join('');
  document.getElementById('theme-legend').querySelectorAll('button[data-th]').forEach(b=>{
    b.onclick = ()=>{ THEME_FOCUS = (THEME_FOCUS===b.dataset.th)?null:b.dataset.th; renderTheme(); };
  });

  let html = '';
  const idxOf = {}; all.forEach((d,i)=>idxOf[d]=i);
  const STG = stageMap();                       // v72：日期旁当日市场阶段
  dts.slice().reverse().forEach(d=>{          // 按时间降序：最新日期排最上
    const di = idxOf[d];
    const themes = (TD[d]||[]).slice().sort((a,b)=>b.count-a.count);
    html += '<div class="trow" data-d="'+d+'"><div class="tdate num">'+fmtDate(d)+
      (STG[d]? '<span class="dstg" style="color:'+STAGE_SOLID[STG[d]]+
        '" title="当日市场阶段（空间龙头四阶段）">'+STG[d]+'</span>':'')+
      (srcMap[d]==='ths'?'<span class="src-ths">※同花顺</span>':'')+'</div><div class="tcards">';
    if(!themes.length){
      // v70：用户口径「没有符合的题材，显示一个『无』字就行」
      html += '<span style="color:'+C.dim2+';font-size:12px;padding:2px 0">无</span>';
    }
    const earnSet = {};
    ((R.money||{})[d]||[]).forEach(g=>{ if(g.theme) earnSet[tName(g.theme)]=1; });
    themes.forEach(b=>{
      const nm = tName(b.name);
      const earn = !!earnSet[nm];              // v38：有赚钱效应的题材金色高亮
      const st = themeStage(nm, d);              // 启动/加强/转弱/反复（四分类）
      const brkN = brkOf(d, nm).length;          // v68：该题材当日高位断板股数
      const stocks = b.stocks||[];
      const leader = stocks.length ? stocks.slice().sort((a,b)=>b.boards-a.boards)[0] : null;
      // 板块梯队：优先用当日 ladders（与空间情绪明细表同一数据源），无则按块内个股算
      const le = (R.ladders&&R.ladders[d]) ? R.ladders[d][nm] : null;
      const boards = le && le.boards ? le.boards
        : [...new Set(stocks.map(s=>s.boards))].sort((a,b)=>b-a);
      const lad = boards.length>1 ? boards.join('-')+'梯队' :
                  (boards.length ? boards[0]+'板梯队' : '');
      const cnt = le && le.count ? le.count : b.count;
      // 龙头（≥2板） + 中位股（2板~龙头下一板） + 首板 三者齐全 = 梯队完整，高亮
      const top = boards.length? boards[0] : 0;
      const hasLeader = top >= 2;
      const hasMid = boards.some(x=>x>=2 && x<top);
      const hasFirst = boards.some(x=>x===1);
      const full = hasLeader && hasMid && hasFirst;
      const col = T_COLOR[nm]||'#9aa6b8';
      html += '<div class="tcard'+(earn?' earn':'')+(THEME_FOCUS&&THEME_FOCUS!==nm?' dim':'')+(full?' full':'')+
        '" data-th="'+nm+'" data-d="'+d+'" '+
        'data-code="'+(leader?leader.code:'')+'" data-name="'+(leader?leader.name:'')+'" data-date="'+d+'" '+
        'title="【'+nm+'】'+(earn?'★赚钱效应题材 · ':'')+'点击查看连续炒作线路图 · '+
        (lad||'—')+(full?'（龙头+中位+首板齐全）':'')+
        ' ｜ 梯队文字可点看当日板块梯队" '+
        'style="background:'+col+'">'+
        '<span class="r1"><span class="nm">'+nm+'</span>'+
        (earn?'<em style="color:#ffd24a;font-weight:800;font-size:9px" title="有赚钱效应">★赚</em>':'')+'</span>'+
        '<span class="r2"><span class="ct">'+cnt+'只</span>'+
        (st? '<span class="stt" style="color:'+STAGE4_COL[st]+'">'+st+'</span>':'')+
        (brkN? '<span class="brkt" title="该题材当日有 '+brkN+
          ' 只昨日 ≥3 板个股断板（点梯队可见断板跟踪）">断'+brkN+'</span>':'')+'</span>'+
        (leader? '<span class="r3"><span class="ld lad" data-lad="1" data-th="'+nm+'" data-d="'+d+'" '+
          'title="点击「'+leader.name+'」查看 '+fmtDate(d)+'「'+nm+'」当日板块梯队（含个股涨停形态）">'+
          leader.name+
          (leader.boards>=2? '<em>'+leader.boards+'板</em>':'<em>首板</em>')+'</span></span>':'')+
        (lad? '<span class="r4"><span class="lad" data-lad="1" data-th="'+nm+'" data-d="'+d+'" '+
              'title="点击查看 '+fmtDate(d)+'「'+nm+'」当日板块梯队">'+
              (full?'★':'')+lad+'</span></span>':'')+
        '</div>';
    });
    // v72：断板后无梯队的题材卡不再单独展示（用户口径「无梯队的不用显示了」）；
    // 主流题材卡上的「断N」绿标与题材浮层内的断板跟踪仍保留。
    html += '</div></div>';
  });
  const list = document.getElementById('theme-list');
  list.innerHTML = html;
  list.scrollTop = 0;                   // 降序排列后最新日期在最上方
  // 点击题材卡 → 弹出该题材连续炒作线路图（每日块均已按「≥3板且非孤股」入链，龙头可再点看日K）
  list.querySelectorAll('.tcard').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      if(el.dataset.brk){ openLadPop(el.dataset.th, el.dataset.d, ev); return; }  // v68 断板卡
      openThPop(el.dataset.th, ev, el.dataset.date);
    };
  });
  // 点击卡片里的「梯队」→ 浮层显示当日板块梯队（阻止冒泡，不触发线路图）
  list.querySelectorAll('.tcard .lad').forEach(el=>{
    el.onclick = ev=>{
      ev.stopPropagation();
      ev.preventDefault();
      openLadPop(el.dataset.th, el.dataset.d, ev);
    };
  });
}

/* ---- 题材卡点「梯队」→ 浮层显示当日板块梯队（各板数 + 完整涨停个股） ---- */
/* 涨停时间：梯队完整清单用 t 字段、题材块个股用 time 字段（数据层同源为 HH:MM） */
function sealOf(s){ return (s && (s.t || s.time)) || ''; }
/* v43 涨停形态配色：一字 / 赚T / 地天 / 普通 / 长腿 / 赚钱 / 低开 */
const SP_CLS = {'一字':'sp-yz','赚T':'sp-zt','地天':'sp-dt','普通':'sp-pt',
                '长腿':'sp-lt','赚钱':'sp-zq','低开':'sp-dk'};
function shapeCls(s){ return SP_CLS[s] || 'sp-pt'; }
const SP_TIP = '形态：一字＝涨停开盘全天未开板 · 赚钱＝高开涨停 · 赚T＝涨停开盘振幅<8% · '+
  '普通＝振幅8%~12% · 长腿＝振幅>12% · 地天＝跌停开盘涨停收盘';
function lateSeal(t){ return !!(t && t >= '14:00'); }
/* ---- v68：高位断板跟踪索引（昨日 ≥3 板 → 统计日断板，自断板日起跟踪 3 日）
   数据 brkTrack.days[展示日] = [{code,name,b,bd,n,chg,cum,th}]，按题材归组；
   在「题材炒作」页该题材的当日梯队最下一行展示（连板梯队页不再展示）。 */
let BRK_MAP = null;
function brkIndex(){
  if(BRK_MAP) return BRK_MAP;
  const m = {}, D = (((window.REVIEW||{}).brkTrack||{}).days) || {};
  Object.keys(D).forEach(d=>{
    const g = {};
    (D[d]||[]).forEach(x=>{
      const k = x.th ? tName(x.th) : '·无题材';
      (g[k] || (g[k]=[])).push(x);
    });
    Object.keys(g).forEach(k=> g[k].sort((a,b)=> b.b-a.b || a.code.localeCompare(b.code)));
    m[d] = g;
  });
  BRK_MAP = m;
  return m;
}
function brkOf(d, nm){ return ((brkIndex()[d]||{})[tName(nm)]) || []; }

function openLadPop(nm, d, ev){
  const R = window.REVIEW;
  const LD = (R.ladders||{})[d] || {};
  const LF = (R.ladderFull||{})[d] || {};
  const e = LD[nm] || null;
  const full = LF[nm] || [];
  const blk = (R.themeDetail[d]||[]).find(x=>tName(x.name)===tName(nm)) || null;
  let stocks = full.length ? full : ((blk&&blk.stocks)||[]);
  const brk = brkOf(d, nm);                    // v68：该题材当日断板（昨日≥3板）跟踪
  // v49：当日确实无该题材收盘涨停梯队时不再「无反应」，给出说明浮层（就地展示，不跳转）
  if(!stocks.length && !e && !brk.length){
    const p0=document.getElementById('ladpop');
    if(p0){
      p0.innerHTML='<span class="popx">✕</span><h4>'+fmtDate(d)+' · '+nm+' · 当日梯队</h4>'+
        '<div style="color:'+C.dim+';font-size:12px;padding:10px 2px;line-height:1.7">'+
        '当日复盘清单中该题材无收盘涨停梯队记录'+
        '<br><span style="color:'+C.dim2+';font-size:11px">'+
        '可能仅为涨停原因归类、或当日该题材无 2 板及以上个股；此处就地展示当日梯队，不跳转题材炒作模块。</span></div>';
      p0.style.display='block';
      const W0=window.innerWidth,H0=window.innerHeight;
      p0.style.left=Math.max(8,Math.min((ev&&ev.clientX||W0/2)+14,W0-p0.offsetWidth-8))+'px';
      p0.style.top =Math.max(8,Math.min((ev&&ev.clientY||H0/2)-40,H0-p0.offsetHeight-8))+'px';
      p0.querySelector('.popx').onclick=()=>{ p0.style.display='none'; };
    }
    return;
  }
  const by = {};
  stocks.forEach(s=>{ const b=s.boards||1; (by[b]||(by[b]=[])).push(s); });
  const boards = Object.keys(by).map(Number).sort((a,b)=>b-a);
  const maxCnt = Math.max(1, ...boards.map(b=>by[b].length));
  const topB = boards.length ? boards[0] : (e?e.maxB:0);
  const rows = boards.map(bd=>{
    const arr = by[bd];
    const w = Math.max(8, Math.round(arr.length/maxCnt*100));
    // v69 角色：最高板＝龙头，低于龙头的连板＝助攻，首板＝跟风
    const role = (bd===topB) ? '龙头' : (bd>=2 ? '助攻' : '跟风');
    return '<div class="lrow">'+
      '<span class="lbd">'+bd+'板<em class="role'+(bd===topB?' lead':'')+'">'+role+'</em></span>'+
      '<span class="lbar" title="'+arr.length+' 只"><i style="width:'+w+'%"></i></span>'+
      '<span class="lstk">'+arr.map(s=>{
        const tm = sealOf(s), sp = s.s || '';
        return '<span class="s'+(bd===topB?' lead':'')+'" data-c="'+(s.code||'')+'" '+
        'data-n="'+s.name+'" data-d="'+d+'" title="'+s.name+' · '+(sp? sp+'板':'—')+
        ' · 涨停时间 '+(tm||'—')+' ｜ 点击查看日K（箭头指 '+fmtDate(d)+'）">'+
        '<b>'+s.name+'</b>'+(sp? '<em class="sp '+shapeCls(sp)+'">'+sp+'</em>':'')+
        (tm? '<em class="st'+(lateSeal(tm)?' late':'')+'">'+tm+'</em>':'')+
        '</span>';
      }).join('')+'</span></div>';
  }).join('');
  // v68：断板跟踪——昨日 ≥3 板个股当日断板，作为「当日梯队最下一行」展示，跟踪 3 日
  const CHG2 = v => v==null ? '<span style="color:'+C.dim2+'">—</span>'
    : '<span style="color:'+(v>=0?C.up:C.down)+';font-weight:700">'+(v>0?'+':'')+v.toFixed(2)+'%</span>';
  const brkRow = brk.length ? '<div class="lrow brkrow">'+
    '<span class="lbd" style="color:'+C.down+'">断板</span>'+
    '<span class="lbar" style="background:none;border:1px dashed #6e3742"></span>'+
    '<span class="lstk">'+brk.map(x=>{
      const dayTag = x.n===0 ? '断板日' : '断板后第'+(x.n+1)+'日';
      return '<span class="s brk" data-c="'+x.code+'" data-n="'+x.name+'" data-d="'+d+'" '+
        'title="'+x.name+'：'+x.b+'板 → '+fmtDate(x.bd)+' 断板，'+dayTag+
        '（自断板日起跟踪 3 个交易日）｜点看日K（箭头指 '+fmtDate(d)+'）">'+
        '<b>'+x.name+'</b>'+
        '<em class="sp brkb">'+x.b+'板→断板</em>'+
        '<em class="st">'+dayTag+'</em>'+
        '<em class="st" style="color:'+C.dim2+'">当'+CHG2(x.chg)+' 累'+CHG2(x.cum)+'</em>'+
        '</span>';
    }).join('')+'</span></div>' : '';
  const st = themeStage(tName(nm), d);
  const cnt = e ? e.count : stocks.length;
  const pop = document.getElementById('ladpop');
  pop.innerHTML = '<span class="popx">✕</span>'+
    '<h4>'+fmtDate(d)+' · '+nm+' · 当日板块梯队 '+
      (e ? e.ladder : (boards.length ? boards.join('-') : '无'))+'</h4>'+
    (rows || '<div style="color:'+C.dim+'">'+
      (brk.length? '当日无涨停梯队（仅高位断板跟踪）' : '当日无梯队个股')+'</div>')+
    brkRow+
    '<div class="lfoot">当日涨停 <b>'+cnt+'</b> 只 · 最高 <b>'+topB+'</b> 板 · 共 '+boards.length+' 个板级'+
    (brk.length? ' · 断板跟踪 <b style="color:'+C.down+'">'+brk.length+'</b> 只':'')+
    (st? ' · 阶段 <b style="color:'+STAGE4_COL[st]+'">'+st+'</b>':'')+
    '<br>横条长度 = 该板级个股数；个股名后标签为<b>涨停形态</b>（'+SP_TIP+'），'+
    '<b style="color:'+C.gold+'">HH:MM</b> 为首次封板（涨停）时间；点个股名看日K（箭头指 '+fmtDate(d)+'）'+
    (brk.length? '<br><b style="color:'+C.down+'">断板</b>行：昨日 ≥3 板个股当日断板（未涨停），'+
      '自断板日起跟踪 3 个交易日；「当」＝当日涨跌幅，「累」＝断板以来累计涨跌幅（以断板日前收为基准）':'')+
    (((window.REVIEW.transmit||{})[d]||{})[nm] ?
      ' <button class="hd-open" id="lad-tr-btn" title="传导路径图：昨日梯队分层→今日传导效果，看钱到第几层断了">⚡ 传导</button>' : '')+'</div>';
  pop.style.display = 'block';
  const W = window.innerWidth, H = window.innerHeight;
  const x = Math.min((ev&&ev.clientX||W/2)+14, W-pop.offsetWidth-8);
  const y = Math.min((ev&&ev.clientY||H/2)-40, H-pop.offsetHeight-8);
  pop.style.left = Math.max(8,x)+'px';
  pop.style.top = Math.max(8,y)+'px';
  pop.querySelector('.popx').onclick = ()=>{ pop.style.display='none'; };
  const trb=document.getElementById('lad-tr-btn');
  if(trb) trb.onclick=e2=>{ e2.stopPropagation(); openTransPop(nm, d, e2); };
  pop.querySelectorAll('.s').forEach(el=>{
    el.onclick = e2=>{
      e2.stopPropagation();
      if(el.dataset.c) showK(el.dataset.c, el.dataset.n, e2, el.dataset.d);
    };
  });
}

/* ---- 题材连续炒作线路图弹窗：从最近一次出现往前，逐日显示（当日达标题材才入链） ---- */
function openThPop(nm, ev, fromD){
  const R = window.REVIEW, TD = R.themeDetail;
  const all = R.themeDates.slice().sort();
  const idx = {}; all.forEach((d,i)=>idx[d]=i);
  const get = d=>(TD[d]||[]).find(x=>tName(x.name)===nm)||null;
  const occ = all.filter(d=>get(d));
  if(!occ.length) return;
  const pop = document.getElementById('thpop');
  // 从 fromD（默认最新出现日）往前，列出全部入链日。
  // themeDetail 在后端已按「板块有 ≥3 板个股且不止一只涨停股」过滤，
  // 这里不能再按家数二次剔除（否则最新日的题材卡点了却看不到当天）。
  let start = occ.length-1;
  if(fromD){
    const fi = occ.indexOf(fromD);
    if(fi >= 0) start = fi;
  }
  const chain = [];
  for(let k=start; k>=0; k--){
    const d = occ[k], b = get(d);
    chain.push({d:d, b:b});
  }
  const stages = TStages()[nm]||{};
  // 「炒了多少次」完整统计：全期入链次数、本次展示次数、首炒/最近日期、四阶段分布。
  // 旧版把次数挤在 h4 标题里（且只算点击日往前的次数），窄屏/长题材名时显示不全。
  const cnt = {'启动':0,'加强':0,'转弱':0,'反复':0};
  chain.forEach(c=>{ const s=stages[c.d]; if(s in cnt) cnt[s] += 1; });
  const sw = Object.keys(cnt).map(k=>
    '<span class="sw"><i style="background:'+STAGE4_COL[k]+'"></i>'+k+
    ' <b>'+cnt[k]+'</b></span>').join('');
  const stat = '<div class="tstat">'+
    '<span>全期炒作 <b class="big">'+occ.length+'</b> 次</span>'+
    '<span>本次展示 <b>'+chain.length+'</b> 次</span>'+
    '<span>首炒 <b>'+fmtDate(occ[0])+'</b></span>'+
    '<span>最近 <b>'+fmtDate(occ[occ.length-1])+'</b></span>'+
    '<span class="row2">阶段分布：'+sw+'</span>'+
    '<span class="note">每次入链 = 当日板块有 ≥3 板个股且不止一只涨停股；'+
      '本次展示自 '+fmtDate(chain.length?chain[0].d:occ[0])+' 往前回溯</span>'+
    '</div>';
  /* v70：改为「连板梯队」格式——每天一列（左→右按时间升序），列内按板位分行，
     个股带首封时间与涨停形态；整块可左右拖动横向查看。 */
  const colsArr = chain.slice().reverse();
  const cols = colsArr.map((c, ci)=>{
    const b = c.b, stocks = (b.stocks||[]).slice();
    const byB = {};
    stocks.forEach(s=>{ const bd = s.boards||1; (byB[bd] || (byB[bd]=[])).push(s); });
    const boards = Object.keys(byB).map(Number).sort((a,b)=>b-a);
    const st = stages[c.d]||'';
    const lv = boards.map(bd=>'<div class="thlv"><span class="lbd">'+bd+'板</span><span class="stks">'+
      byB[bd].sort((a,b)=> String(sealOf(a)||'99').localeCompare(String(sealOf(b)||'99')))
        .map(s=>'<span class="thstk" data-c="'+s.code+'" data-n="'+s.name+'" data-d="'+c.d+'" '+
          'title="'+s.name+'：'+bd+'板 · 首封 '+(sealOf(s)||'—')+(s.s? ' · '+s.s:'')+
          '（'+fmtDate(c.d)+'）｜点看日K">'+s.name+
          '<span class="tt">'+(sealOf(s)||'')+'</span>'+(s.s? '<em>'+s.s+'</em>':'')+'</span>').join('')+
      '</span></div>').join('');
    return '<div class="thcol'+(ci===colsArr.length-1? ' newest':'')+'">'+
      '<div class="thcol-hd"><span>'+fmtDate(c.d)+' · '+b.count+'只</span>'+
      (st? '<span class="stg4" style="color:'+STAGE4_COL[st]+'">'+st+'</span>':'')+'</div>'+
      (lv || '<div style="color:'+C.dim2+';font-size:10px">当日无梯队个股</div>')+'</div>';
  }).join('');
  const HO=(window.REVIEW.handover||{}).theme||{};
  const hoBtn = HO[nm] && HO[nm].length
    ? '<button class="hd-open" data-kind="theme" data-th="'+nm+'" title="新旧龙头交接：最近断板龙头 vs 最新龙头 K线叠加">🔀 新旧交接</button>' : '';
  pop.innerHTML = '<span class="popx">✕</span><h4>'+nm+' · 连续炒作线路图'+hoBtn+'</h4>'+
    stat +
    '<div class="thscroll" id="thscroll">'+
    (cols || '<div style="color:'+C.dim+'">该题材近期无入链记录</div>')+'</div>'+
    '<div class="seal-note">每日一列（左→右按时间升序）· 列内按板位分行（板位从高到低）· '+
    '个股后为首次封板时间与涨停形态 · 按住图内左右拖动查看更早的炒作 · 点个股看日K</div>';
  pop.style.display = 'block';
  const hob=pop.querySelector('.hd-open');
  if(hob) hob.onclick=e=>{ e.stopPropagation(); openHandover('theme',nm,e,fromD||chain[0]&&chain[0].d); };
  // 定位到点击处（防裁切）
  const W = window.innerWidth, H = window.innerHeight;
  let x = Math.min((ev&&ev.clientX||W/2)+14, W-pop.offsetWidth-8);
  let y = Math.min((ev&&ev.clientY||H/2)-40, H-pop.offsetHeight-8);
  pop.style.left = Math.max(8,x)+'px'; pop.style.top = Math.max(8,y)+'px';
  pop.querySelector('.popx').onclick = ()=>{ pop.style.display='none'; };
  // v70：横向拖动（左右拉看更早的炒作）
  const sc = pop.querySelector('#thscroll');
  if(sc){
    let dg = null;
    sc.addEventListener('mousedown', e=>{
      if(e.target.closest('.thstk')) return;         // 点个股不触发拖动
      dg = {x:e.clientX, l:sc.scrollLeft}; sc.classList.add('dragging'); e.preventDefault();
    });
    sc.addEventListener('mousemove', e=>{ if(dg) sc.scrollLeft = dg.l - (e.clientX - dg.x); });
    const stop = ()=>{ dg = null; sc.classList.remove('dragging'); };
    sc.addEventListener('mouseleave', stop);
    window.addEventListener('mouseup', stop);
    sc.scrollLeft = sc.scrollWidth;                  // 默认停在最新（最右）
  }
  // 个股点击 → 日K
  pop.querySelectorAll('.thstk').forEach(el=>{
    el.onclick = e=>{
      e.stopPropagation();
      showK(el.dataset.c, el.dataset.n, e, el.dataset.d);
    };
  });
}

/* ================= v56 新旧龙头交接叠加图 =================
   kind='theme'(题材板块龙头) / 'space'(全市场空间龙头)。
   按交接日对齐各龙头日K，以窗口首日收盘归一化成涨幅%后叠加：
   默认蜡烛K线(开/高/低/收全归一)，可切折线(仅收盘)；每只个股唯一颜色+末端标注+可点图例看日K。 */
let HD_STATE = null, HD_CHART = null;
// 新旧各自独立调色板，按组内序号取色（同组不重色），用于小图标题个股名标识
const HD_COLORS_NEW = ['#f5455c','#f0b90b','#ff8c42','#ff5fa2','#e04343','#ffa726','#f76b8a','#ffcf5c'];
const HD_COLORS_OLD = ['#5a9fe0','#7a6fa8','#4fb3a6','#c9a24a','#8a7ad0','#4aa08a','#6a8fd0','#b08a5a'];
async function openHandover(kind, themeName, ev, anchorDate){
  const R=window.REVIEW, HO=R.handover||{};
  let evs = kind==='theme' ? ((HO.theme||{})[themeName]||[]) : (HO.space||[]);
  if(!evs.length){ toast('「'+(themeName||'全市场')+'」暂无新旧龙头交接记录'); return; }
  // 定位到 <= 锚点日的最近一次交接；无锚点则最新
  let cur = evs.length-1;
  if(anchorDate){
    for(let i=evs.length-1;i>=0;i--){ if(evs[i].date<=anchorDate){ cur=i; break; } }
  }
  HD_STATE = {kind, themeName, evs, cur};
  const pop=document.getElementById('hdpop');
  pop.style.display='flex';
  // 定位（点击处附近 / 屏幕中央）
  const W=window.innerWidth,H=window.innerHeight;
  let x=Math.min((ev&&ev.clientX||W/2)-300, W-pop.offsetWidth-8);
  let y=Math.min((ev&&ev.clientY||H/2)-120, H-pop.offsetHeight-8);
  pop.style.left=Math.max(8,x)+'px'; pop.style.top=Math.max(8,y)+'px';
  document.getElementById('hdpop-x').onclick=()=>{ pop.style.display='none'; };
  document.getElementById('hd-prev').onclick=()=>{ if(HD_STATE.cur>0){HD_STATE.cur--;renderHandover();} };
  document.getElementById('hd-next').onclick=()=>{ if(HD_STATE.cur<HD_STATE.evs.length-1){HD_STATE.cur++;renderHandover();} };
  hdBuildYmd();
  // 标题拖动（就地实现，避免依赖）
  const hd=document.getElementById('hdpop-t');
  if(!hd.__drag){ hd.__drag=1;
    let ds=null;
    hd.addEventListener('mousedown',e=>{ ds={x:e.clientX,y:e.clientY,l:pop.offsetLeft,t:pop.offsetTop}; });
    window.addEventListener('mousemove',e=>{ if(!ds)return;
      pop.style.left=Math.max(0,ds.l+e.clientX-ds.x)+'px';
      pop.style.top=Math.max(0,ds.t+e.clientY-ds.y)+'px'; });
    window.addEventListener('mouseup',()=>{ ds=null; });
  }
  renderHandover();
}
/* v58：交接弹窗「年 / 月 / 日」三段选择 → 跳转对应日期的交接情况。
   跳转规则：优先精确命中该日；否则取 < 该日的最近一次交接；再无则取 > 该日的最近一次。 */
function hdBuildYmd(){
  const host=document.getElementById('hd-ymd');
  if(!host || !HD_STATE) return;
  const ds=(window.REVIEW.dates||[]).slice().sort();
  const years=[...new Set(ds.map(x=>x.slice(0,4)))].sort();
  const cur=HD_STATE.evs[HD_STATE.cur] ? HD_STATE.evs[HD_STATE.cur].date : ds[ds.length-1];
  host.innerHTML='跳转 <select class="hy" title="年">'+years.map(v=>'<option value="'+v+'"'+
    (cur.slice(0,4)===v?' selected':'')+'>'+v+'</option>').join('')+'</select>'+
    '<select class="hm" title="月"></select><select class="hd" title="日"></select>'+
    '<button>跳转</button>';
  const y=host.querySelector('.hy'), m=host.querySelector('.hm'), d=host.querySelector('.hd');
  const fillM=keep=>{
    const ms=[...new Set(ds.filter(x=>x.startsWith(y.value)).map(x=>x.slice(4,6)))].sort();
    m.innerHTML=ms.map(v=>'<option value="'+v+'"'+(keep===v?' selected':'')+'>'+(+v)+'月</option>').join('');
    fillD();
  };
  const fillD=keep=>{
    const list=ds.filter(x=>x.startsWith(y.value+m.value));
    d.innerHTML=list.map(v=>'<option value="'+v+'"'+(keep===v?' selected':'')+'>'+(+v.slice(6))+'日</option>').join('');
  };
  y.onchange=()=>fillM(); m.onchange=()=>fillD();
  fillM(cur.slice(4,6)); fillD(cur);
  host.querySelector('button').onclick=()=>{
    const v=d.value;
    if(!v) return;
    const evs=HD_STATE.evs;
    let idx=-1;
    for(let i=0;i<evs.length;i++){ if(evs[i].date===v){ idx=i; break; } }
    if(idx<0){ for(let i=0;i<evs.length;i++){ if(evs[i].date<v && (idx<0||evs[i].date>evs[idx].date)) idx=i; } }
    if(idx<0){ idx=0; for(let i=1;i<evs.length;i++){ if(evs[i].date<evs[idx].date) idx=i; } }
    HD_STATE.cur=idx; renderHandover();
  };
}
async function renderHandover(){
  if(!HD_STATE) return;
  const S=HD_STATE, e=S.evs[S.cur], R=window.REVIEW;
  const dates=R.dates||[];
  const title=document.getElementById('hdpop-t');
  title.innerHTML=(S.kind==='theme'? '【'+S.themeName+'】板块龙头交接' : '全市场空间龙头交接')+
    ' · 交接日 '+fmtDate(e.date)+' <small>上=新龙头 · 下=旧龙头 · 真实价格日K · 时间对齐</small>';
  document.getElementById('hd-idx').textContent='第 '+(S.cur+1)+' / '+S.evs.length+' 次（'+fmtDate(e.date)+'）';
  document.getElementById('hdpop-lg').innerHTML='';
  document.getElementById('hdpop-note').textContent='加载龙头日K…';
  const di=dates.indexOf(e.date);
  const PRE=8, POST=6;
  const lo=Math.max(0,di-PRE), hi=Math.min(dates.length-1,di+POST);
  const winDates=dates.slice(lo,hi+1);
  const HI=di-lo;                       // 交接日在窗口内的索引
  const news=e.new||[], olds=e.old||[];
  // 异步取每只龙头完整日K（新旧各按组内序号取唯一标识色）
  const fetched=[];
  await Promise.all([
    ...news.map((x,gi)=>({x,gi,grp:'new'})),
    ...olds.map((x,gi)=>({x,gi,grp:'old'}))
  ].map(async o=>{
    let bars=[];
    try{ bars=await stockKBars(o.x.code); }catch(err){ bars=[]; }   // 取全量最新日K，覆盖交接日之后窗口
    // v58：实时口径下合并最新日K（补交接窗口右端的当日实时 bar）
    if(LIVE_K){
      try{ const lb=await liveK(o.x.code); if(lb&&lb.length){
        const mm={}; (bars||[]).forEach(b=>mm[b[0]]=b); lb.forEach(b=>mm[b[0]]=b);
        bars=Object.keys(mm).sort().map(k=>mm[k]); } }catch(err){}
    }
    const bmap={}; (bars||[]).forEach(b=>{ if(b&&b[0]) bmap[b[0]]=b; });
    o.bmap=bmap;
    fetched.push(o);
  }));
  // v58：剔除「幽灵列」——窗口内某交易日所有龙头都无K线（日历错日/全市场停牌）
  // 且又不是交接日本身 → 该列不展示，避免整列空白导致「K线显示不全」的观感
  const keepIdx=[];
  winDates.forEach((wd,wi)=>{
    if(wd===e.date || fetched.some(o=>o.bmap[wd])) keepIdx.push(wi);
  });
  if(!keepIdx.includes(HI)) keepIdx.push(HI);
  keepIdx.sort((a,b)=>a-b);
  const winDates2=keepIdx.map(wi=>winDates[wi]);
  const HI2=keepIdx.indexOf(HI);                     // 交接日在过滤后窗口内的索引
  // 上排新龙头、下排旧龙头（保持原顺序；无日K的跳过）
  const ordered=[...news.map(x=>fetched.find(o=>o.x===x)).filter(Boolean),
                 ...olds.map(x=>fetched.find(o=>o.x===x)).filter(Boolean)];
  const nG=ordered.length;
  ordered.forEach(o=>{
    o.row=keepIdx.map(wi=>{ const wd=winDates[wi], b=o.bmap[wd];
      return b&&b[2] ? [b[1],b[2],b[3],b[4]] : ['-','-','-','-']; });
  });
  const c=document.getElementById('hdpop-c');
  if(!HD_CHART) HD_CHART=echarts.init(c,null,{renderer:'canvas'});
  HD_CHART.clear();
  // 清掉旧的自定义标题层
  c.querySelectorAll('.hdhead').forEach(el=>el.remove());
  if(!nG){
    document.getElementById('hdpop-note').textContent='该次交接的龙头日K数据不可用（历史K线源缺失）';
    return;
  }
  const GH=128, TOPPAD=18, AXH=24;      // 每小图高 / 标题条高 / 底部日期轴高
  c.style.height=(nG*GH+AXH)+'px';
  HD_CHART.resize();
  const grids=[],xAxes=[],yAxes=[],series=[];
  ordered.forEach((o,i)=>{
    const last=i===nG-1;
    const pal=o.grp==='new'?HD_COLORS_NEW:HD_COLORS_OLD;
    const col=pal[o.gi%pal.length];
    o.col=col;
    grids.push({left:64,right:16,top:i*GH+TOPPAD,height:GH-TOPPAD-6});
    xAxes.push({type:'category',gridIndex:i,data:winDates2,boundaryGap:true,
      axisLabel:{show:last,color:'#9aa7bd',fontSize:9.5,formatter:v=>v.slice(4,6)+'-'+v.slice(6)},
      axisLine:{lineStyle:{color:'#2b3a56'}},axisTick:{show:false}});
    yAxes.push({type:'value',gridIndex:i,scale:true,
      axisLabel:{color:'#9aa7bd',fontSize:9,formatter:v=>v>=10000?(v/10000).toFixed(1)+'万':(v>=1000?(v/1000).toFixed(1)+'k':v)},
      splitLine:{lineStyle:{color:'#1c2436'}},axisLine:{show:false}});
    const ser={name:o.x.name,type:'candlestick',data:o.row,barMaxWidth:9,
      xAxisIndex:i,yAxisIndex:i,               // v57修复：绑定各自网格（否则全部画进第0格）
      itemStyle:{color:'#f5455c',color0:'#2ebd85',borderColor:'#f5455c',borderColor0:'#2ebd85'},
      markLine:{silent:true,symbol:'none',animation:false,
        data:[{xAxis:HI2}],lineStyle:{color:'#f0b90b',type:'dashed',width:1.2},
        label:{show:i===0,formatter:'交接日',color:'#f0b90b',fontSize:9.5,position:'insideEndTop'}}};
    series.push(ser);
    // 每小图上方的个股标题层（HTML，点击弹完整日K）
    const hd=document.createElement('div');
    hd.className='hdhead';
    hd.style.top=(i*GH+2)+'px';
    hd.style.width='calc(100% - 84px)';
    hd.title='点看 '+o.x.name+' 完整日K';
    hd.innerHTML='<i class="sw" style="width:9px;height:9px;border-radius:2px;display:inline-block;background:'+col+'"></i>'+
      (o.grp==='new'?'🆕':'🔻')+'<b style="color:'+col+'">'+o.x.name+'</b>'+
      '<span class="bd">'+o.x.boards+'板</span>'+
      (o.grp==='old'&&o.x.lastDate? '<span class="brk">'+fmtDate(o.x.lastDate)+'断板</span>':'')+
      '<span class="brk">'+(o.x.date?' '+fmtDate(o.x.date):'')+'</span>';
    hd.onclick=()=>showK(o.x.code,o.x.name,null,o.grp==='old'?(o.x.lastDate||e.date):e.date);
    c.appendChild(hd);
  });
  HD_CHART.setOption({
    animation:false,
    axisPointer:{link:[{xAxisIndex:'all'}]},          // 上下时间轴联动十字线
    tooltip:{trigger:'axis',confine:true,formatter:ps=>{
      if(!ps||!ps.length) return '';
      const p=ps.find(z=>z.seriesType==='candlestick'); if(!p) return '';
      const o=ordered[p.seriesIndex]; if(!o) return '';
      const j=p.dataIndex, wd=winDates2[j];
      const d=p.data&&p.data.length? p.data : null;   // [idx,开,收,低,高]
      if(!d||d[1]==='-'||d[1]==null) return fmtDate(wd)+'（'+o.x.name+'）<br/>当日无K线数据';
      const wdIdx=dates.indexOf(wd);
      const prev=wdIdx>0? (o.bmap[dates[wdIdx-1]]||[])[2] : null;
      const chg=prev? (d[2]/prev-1)*100 : null;
      return '<b>'+o.x.name+'</b> '+fmtDate(wd)+'<br/>'+
        '开 '+d[1]+'　收 <b style="color:'+(d[2]>=d[1]?'#f5455c':'#2ebd85')+'">'+d[2]+'</b><br/>'+
        '低 '+d[3]+'　高 '+d[4]+
        (chg!=null? '<br/>涨跌 <b style="color:'+(chg>=0?'#f5455c':'#2ebd85')+'">'+(chg>=0?'+':'')+chg.toFixed(2)+'%</b>':'');
    }},
    legend:{show:false},
    grid:grids,
    xAxis:xAxes,
    yAxis:yAxes,
    series:series
  },true);
  // 底部说明 + 新旧龙头名（可点弹完整日K）
  document.getElementById('hdpop-lg').innerHTML=
    '<span class="hd-grp"><b>🆕 新龙头(上位)：</b>'+
    (news.length?news.map((x,gi)=>'<a data-c="'+x.code+'" data-n="'+x.name+'" data-d="'+e.date+
      '" style="color:'+(HD_COLORS_NEW[gi%HD_COLORS_NEW.length])+'">'+x.name+' '+x.boards+'板</a>').join('、'):'—')+
    '　｜　<b>🔻 旧龙头(断板)：</b>'+
    (olds.length?olds.map((x,gi)=>'<a data-c="'+x.code+'" data-n="'+x.name+'" data-d="'+(x.lastDate||e.date)+
      '" style="color:'+(HD_COLORS_OLD[gi%HD_COLORS_OLD.length])+'">'+x.name+' '+x.boards+'板</a>').join('、'):'—')+
    '</span>';
  document.querySelectorAll('#hdpop-lg a[data-c]').forEach(a=>{
    a.onclick=()=>showK(a.dataset.c,a.dataset.n,null,a.dataset.d);
  });
  document.getElementById('hdpop-note').textContent='横轴=真实交易日（底部），上下小图时间对齐；'+
    '黄虚线=交接日 '+fmtDate(e.date)+'；K线为真实价格（红涨绿跌）；窗口 前'+PRE+'/后'+POST+' 交易日；点个股名看完整日K';
}
